<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test voix IA — Panique en coulisses</title><style>
body{font-family:system-ui;background:#10131a;color:#f5f5f5;margin:0;padding:18px}main{max-width:760px;margin:auto}.card{background:#1b202b;border-radius:18px;padding:18px;margin:14px 0}button{font-size:1rem;padding:13px 16px;border:0;border-radius:12px;background:#f6c64e;font-weight:750;margin:6px 4px}.voice{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #333;padding:9px 0}.ok{color:#75df9a}.err{color:#ff8585}#log{white-space:pre-wrap;font-size:.92rem}small{opacity:.72}</style></head><body><main>
<h1>🎭 Panique en coulisses</h1><p><b>Test des voix IA Piper</b></p>
<div class="card"><p id="state">Chargement du moteur IA…</p><div id="voices"></div><p id="log"></p></div>
<div class="card"><b>Important</b><p>Au premier essai d'une voix, le téléphone doit télécharger son modèle. Cela peut prendre un moment. Ensuite il est mis en cache dans le navigateur.</p><small>Test technique avant intégration du texte complet.</small></div>
<script type="module">
const people=[
["Christian","fr_FR-tom-medium","Christian, on reprend depuis le début. Et cette fois, le texte !"],
["Patrice","fr_FR-gilles-low","Bon, on peut peut-être essayer de travailler maintenant ?"],
["Philippe","fr_FR-tom-medium","Je plaisante, bien sûr ! Je plaisante !"],
["Carole","fr_FR-siwis-medium","Très bien. Alors on va se démerder."],
["Florence","fr_FR-upmc-medium","Bon… ben moi, je crois qu'on a tous besoin d'un verre !"],
["Pascale","fr_FR-mls-medium","Ouais… ben je vais reprendre un Doliprane."]
];
const state=document.querySelector("#state"), box=document.querySelector("#voices"), log=document.querySelector("#log");
people.forEach(([name])=>{const d=document.createElement("div");d.className="voice";d.innerHTML='<b>'+name+'</b><button data-name="'+name+'">▶ Tester</button>';box.appendChild(d)});
let tts=null;
try{
 state.textContent="Chargement de Piper…";
 tts=await import("https://cdn.jsdelivr.net/npm/@mintplex-labs/piper-tts-web@1.0.5/+esm");
 state.innerHTML='<span class="ok">✓ Moteur chargé. Choisis une voix.</span>';
}catch(e){state.innerHTML='<span class="err">✗ Le moteur n’a pas pu se charger.</span>';log.textContent=String(e)}
box.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b||!tts)return;const p=people.find(x=>x[0]===b.dataset.name);b.disabled=true;state.textContent="Préparation de "+p[0]+"… premier chargement parfois long.";
 try{const wav=await tts.predict({text:p[2],voiceId:p[1]},prog=>{if(prog?.total)state.textContent=p[0]+" : téléchargement "+Math.round(prog.loaded*100/prog.total)+" %"});const a=new Audio(URL.createObjectURL(wav));await a.play();state.innerHTML='<span class="ok">✓ '+p[0]+' fonctionne.</span>';log.textContent=""}
 catch(err){state.innerHTML='<span class="err">✗ Erreur avec '+p[0]+'.</span>';log.textContent=String(err)}
 finally{b.disabled=false}});
</script></main></body></html>
