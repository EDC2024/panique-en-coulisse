<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panique en coulisses — Répétiteur</title><style>
body{font-family:system-ui,sans-serif;background:#10131a;color:#f4f4f4;margin:0;padding:18px}main{max-width:760px;margin:auto}.card{background:#1b202b;border-radius:16px;padding:18px;margin:12px 0}h1{font-size:1.7rem}button,select,input{font-size:1rem;padding:11px;border-radius:10px;border:0;margin:5px}button{background:#f3c44e;color:#111;font-weight:700}.stop{background:#e66}.line{padding:12px;border-left:4px solid #f3c44e;margin:8px 0;background:#141923}.mine{opacity:.5}.status{font-weight:700}.controls{display:flex;flex-wrap:wrap;gap:5px}small{opacity:.75}</style></head>
<body><main><h1>🎭 Panique en coulisses</h1><p>Répétiteur — test web mobile</p>
<div class="card"><label>Je répète : <select id="role"></select></label><div class="controls"><button id="start">▶ Démarrer</button><button id="prev">⏮ Précédente</button><button class="stop" id="stop">■ Stop</button><button id="prompt">💡 Souffleur</button></div><label>Vitesse <input id="rate" type="range" min=".7" max="1.3" step=".05" value="1"></label><p class="status" id="status">Prêt.</p></div>
<div class="card"><h2>Voix détectées</h2><p id="voices">Chargement…</p><small>Cette première version vérifie le fonctionnement du site sur le Samsung. Les voix IA seront l'étape suivante.</small></div><div class="card"><h2>Scène test</h2><div id="scene"></div></div></main>
<script>
const chars=["CHRISTIAN","CAROLE","FLORENCE","PASCALE","PATRICE","PHILIPPE"],lines=[["FLORENCE","Mais t'es vraiment conne !"],["CAROLE","Et toi t'es vraiment une pauvre fille !"],["CHRISTIAN","STOP ! STOP ! STOP !"],["CHRISTIAN","Le texte ! On respecte le texte !"],["FLORENCE","Mais on essayait de mettre un peu de naturel."],["CHRISTIAN","Du naturel, oui. Mais du naturel écrit !"],["CAROLE","Ça commence bien."],["CHRISTIAN","On reprend. Et cette fois : le texte !"]];let i=0,running=false,lastOwn="";
const role=document.querySelector("#role");chars.forEach(c=>role.add(new Option(c[0]+c.slice(1).toLowerCase(),c)));role.value="CHRISTIAN";
function draw(){scene.innerHTML=lines.map((l,n)=>'<div class="line '+(l[0]===role.value?'mine':'')+'" id="l'+n+'"><b>'+l[0]+'</b> — '+l[1]+'</div>').join("")}role.onchange=draw;draw();
function voices(){let v=speechSynthesis.getVoices().filter(x=>x.lang.toLowerCase().startsWith("fr"));document.querySelector("#voices").textContent=v.length?v.length+" voix françaises : "+v.map(x=>x.name).join(", "):"Aucune voix française détectée pour l'instant."}speechSynthesis.onvoiceschanged=voices;voices();
const wait=ms=>new Promise(r=>setTimeout(r,ms));function speak(t){return new Promise(res=>{let u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=Number(rate.value);u.onend=res;u.onerror=res;speechSynthesis.speak(u)})}
async function run(){running=true;for(;i<lines.length&&running;i++){status.textContent=lines[i][0]+"…";document.querySelector("#l"+i).scrollIntoView({behavior:"smooth",block:"center"});if(lines[i][0]===role.value){lastOwn=lines[i][1];await wait(Math.max(1400,lines[i][1].split(/\s+/).length*430/Number(rate.value)))}else await speak(lines[i][1]);await wait(250)}if(i>=lines.length){running=false;i=0;status.textContent="Fin de la scène test."}}
start.onclick=()=>{if(!running)run()};stop.onclick=()=>{running=false;speechSynthesis.cancel();status.textContent="Arrêté."};prev.onclick=()=>{running=false;speechSynthesis.cancel();i=Math.max(0,i-1);status.textContent="Réplique précédente prête."};prompt.onclick=()=>status.textContent=lastOwn?"💡 "+lastOwn:"Pas encore de réplique à souffler.";
</script></body></html>
