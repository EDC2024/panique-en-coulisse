:"Florence","label":"Florence(elle compte sur ses doigts)","text":"Je… je ne peux pas épeler ?"},{"actor":"Christian","label":"Christian","text":"Bon, bon, bon, allez, on y reviendra…"},{"actor":"Carole","label":"Carole","text":"Pascale et Philippe répètent le texte dans la salle d’en haut !"},{"actor":"Florence","label":"Florence","text":"C’est eux qu’on entend gueuler comme ça ?!"},{"actor":"Carole","label":"Carole","text":"Non, ça, c’est le cours de chant du troisième âge !"},{"actor":"Christian","label":"Christian","text":"Pascale, Philippe, vous pouvez venir sur scène, s’il vous plaît !"},{"actor":"Philippe","label":"Philippe (en criant)","text":"T’as raison de gueuler comme ça, on est vieux et complètement sourds !"},{"actor":"Christian","label":"Christian","text":"?"},{"actor":"Philippe","label":"Philippe (en riant)","text":"Je plaisante, bien sûr ! Je plaisante !"},{"actor":"Pascale","label":"Pascale","text":"J’ai un de ces mal de tronche, moi ! Quelqu’un aurait un Doliprane ?"},{"actor":"Carole","label":"Carole","text":"Il faut dire qu’entre les cours de chant et les cours de claquettes de Graciela, il faut s’accrocher !"},{"actor":"Florence","label":"Florence","text":"Moi, j’aime bien le flamenco, c’est festif ! En plus, j’adore la sangria !"},{"actor":"Carole","label":"Carole (narquoise)","text":"Entre autres !"},{"actor":"Pascale","label":"Pascale","text":"Il y a un tel merdier là-haut que j’ai l’impression d’en avoir oublié mon texte !"},{"actor":"Philippe","label":"Philippe","text":"Ce n’est pas qu’une impression !"},{"actor":"Pascale","label":"Pascale","text":"?"},{"actor":"Philippe","label":"Philippe (en riant)","text":"Je plaisante, bien sûr ! Je plaisante !"},{"actor":"Christian","label":"Christian","text":"Donc, je disais que je profite que la répétition soit arrêtée pour faire un point… Donc déjà, ma femme, je veux dire Nathalie, aura un peu de retard, son cours de Zumba a encore pris du retard ! Mais elle va arriver… Donc, je disais…"},{"actor":"Pascale","label":"Pascale","text":"On n’attend pas Patrice ?!"},{"actor":"Carole","label":"Carole","text":"C’est vrai ça, où qu’il est Patrice, hein ? Où qu’il est ?!"},{"actor":"Christian","label":"Christian","text":"C’est vrai, où il est Patrice ?!"},{"actor":"Philippe","label":"Philippe","text":"C’est vrai qu’avec ses fonctions, difficile d’arriver à l’heure !"},{"actor":"Christian","label":"Christian","text":"Ben moi aussi, j’ai des fonctions et j’arrive à l’heure !"},{"actor":"Carole","label":"Carole","text":"Probablement une réunion de dernière minuts !"},{"actor":"Christian","label":"Christian","text":"Peut-être, mais 20 minutes, ça fait beaucoup, non ?!"},{"actor":"Carole","label":"Carole","text":"À chaque répétition !"},{"actor":"Pascale","label":"Pascale (énamourée)","text":"C’est un garçon qui sait se faire désirer…"},{"actor":"Florence","label":"Florence","text":"Et si on buvait un coup en attendant, ça le fera venir !"},{"actor":"Pascale","label":"Pascale","text":"Excellente idée, ça pourrait être bon pour mon mal de tête !"},{"actor":"Christian","label":"Christian","text":"Ce n’est pas le moment !!! Je vous rappelle : pas d’alcool pendant les répétitions, surtout aujourd’hui ! Je rappelle que c’est…"},{"actor":"Patrice","label":"Patrice","text":"Salut tout le monde ! Désolé pour le retard !"},{"actor":"Christian","label":"Christian","text":"Ah ben quand même !"},{"actor":"Patrice","label":"Patrice","text":"Quoi ? Je ne suis pas si en retard que ça !"},{"actor":"Carole","label":"Carole","text":"Non, non… T’es même plutôt en avance sur d’habitude !"},{"actor":"Patrice","label":"Patrice","text":"Oh ça va, hein !"},{"actor":"Pascale","label":"Pascale (énamourée)","text":"C’est vrai qu’il sait se faire désirer…"},{"actor":"Florence","label":"Florence","text":"Ça doit être sa voix ! J’adore sa voix ! Suave !"},{"actor":"Pascale","label":"Pascale","text":"Moi, je dirais que ce sont ses yeux ! Acier…, perçants et métalliques."},{"actor":"Florence","label":"Florence","text":"Ou alors sa façon de s’habiller !"},{"actor":"Pascale","label":"Pascale","text":"La classe !"},{"actor":"Florence","label":"Florence","text":"On dirait un directeur…."},{"actor":"Pascale","label":"Pascale","text":"Ben il est directeur !"},{"actor":"Florence","label":"Florence","text":"Ah bon !? Ça doit être ça alors… L’homme de pouvoir !"},{"actor":"Carole","label":"Carole","text":"Moi, c’est sa coupe de cheveux !"},{"actor":"Carole","label":"Carole","text":"Façon boule de billard !"},{"actor":"Pascale","label":"Pascale","text":"Moi j’aurais dit Monsieur Propre…"},{"actor":"Christian","label":"Christian","text":"Ça fait vingt minutes qu’on t’attend !"},{"actor":"Patrice","label":"Patrice","text":"Vingt minutes ?! Putain, ça passe vite quand on est occupé !"},{"actor":"Christian","label":"Christian","text":"Occupé à quoi ?"},{"actor":"Patrice","label":"Patrice","text":"Ben… à arriver !"},{"actor":"Christian","label":"Christian","text":"…?"},{"actor":"Patrice","label":"Patrice","text":"Je plaisante !"},{"actor":"Philippe","label":"Philippe","text":"Eh ! C’est moi qui fais les blagues ici !"},{"actor":"Christian","label":"Christian","text":"Bon ! Maintenant que tout le monde est là…"},{"actor":"Patrice","label":"Patrice","text":"Nathalie n’est pas là ?"},{"actor":"Christian","label":"Christian","text":"Non. Pourquoi ?"},{"actor":"Patrice","label":"Patrice","text":"Pour rien… J’ai vu sa voiture…"},{"actor":"Christian","label":"Christian","text":"Où ça ?"},{"actor":"Patrice","label":"Patrice","text":"… Je sais plus."},{"actor":"Christian","label":"Christian","text":"Bon, ON S’EN FOUT ! Nathalie va arriver. Maintenant, si ça ne vous dérange pas, j’aimerais qu’on puisse enfin commencer cette putain de répétition !"},{"actor":"Florence","label":"Florence","text":"Je l’ouvrais bien cette petite bouteille !"},{"actor":"Pascale","label":"Pascale","text":"Pour mon mal de tête !"},{"actor":"Christian","label":"Christian","text":"BON ! Maintenant que Monsieur Patrice a bien voulu nous honorer de sa présence… Je peux peut-être finir ce que j’étais en train de dire !"},{"actor":"Patrice","label":"Patrice","text":"Je t’en prie !"},{"actor":"Christian","label":"Christian","text":"Merci ! Donc, je vous rappelle quand même qu’on joue pour la première fois demain soir, devant les habitants de Gruissan !"},{"actor":"Philippe","label":"Philippe","text":"Ah bon ?! C’est demain ?!"},{"actor":"Philippe","label":"Philippe (en riant)","text":"Je plaisante, bien sûr ! Je plaisante !"},{"actor":"Christian","label":"Christian","text":"Et il paraît que le public gruissanais est particulièrement exigeant !"},{"actor":"Florence","label":"Florence","text":"Mais ils sont sympas, les Gruissanais !"},{"actor":"Christian","label":"Christian","text":"Je n’ai pas dit qu’ils n’étaient pas sympas ! Ils sont sympas… mais exigeants ! Et ils ont raison ! Ils ne vont pas se déplacer, payer une place, s’asseoir pendant une heure et demie pour voir des comédiens qui cherchent leurs mots toutes les trente secondes !"},{"actor":"Pascale","label":"Pascale","text":"Ça va, on sera prêts demain !"},{"actor":"Christian","label":"Christian","text":"Ah oui ?! Ben pour l’instant, j’en ai deux qui répètent dans le couloir, un qui arrive avec vingt minutes de retard, une qui oublie « sale conne » et une autre qui a oublié son texte à cause du cours de chant !"},{"actor":"Pascale","label":"Pascale","text":"J’ai pas dit que je l’avais oublié !"},{"actor":"Philippe","label":"Philippe","text":"Elle a dit qu’elle avait l’impression de l’avoir oublié !"},{"actor":"Christian","label":"Christian","text":"Ah ben ça me rassure énormément !"},{"actor":"Carole","label":"Carole","text":"Et puis on a encore toute la soirée !"},{"actor":"Christian","label":"Christian","text":"Justement ! C’est la dernière répétition ! Alors ce soir, on ne lâche rien. Les entrées, les sorties, les déplacements, les accessoires et surtout… VOTRE TEXTE ! LE TEXTE !"},{"actor":"Patrice","label":"Patrice","text":"T’inquiète pas Christian, demain soir, on sera prêts."},{"actor":"Christian","label":"Christian","text":"C’est pas demain soir qu’il faut être prêt… C’EST MAINTENANT !"},{"actor":"Philippe","label":"Philippe (au garde à vous)","text":"Oui, chef !"},{"actor":"Christian","label":"Christian","text":"Bon ! Et puisque visiblement certains ont encore besoin qu’on leur rafraîchisse la mémoire, on va reprendre les personnages !"},{"actor":"Carole","label":"Carole","text":"Oh non…"},{"actor":"Christian","label":"Christian","text":"Oh si ! Carole ! Cindy, secrétaire de l’hôpital des Mimosas. Un peu vulgaire, pas très futée, toujours au courant de tout…"},{"actor":"Carole","label":"Carole","text":"En gros, je joue une conne."},{"actor":"Christian","label":"Christian","text":"J’ai pas dit ça !"},{"actor":"Carole","label":"Carole","text":"Non, mais t’as mis les formes."},{"actor":"Christian","label":"Christian","text":"Florence ! Pamela. Psy…"},{"actor":"Pascale","label":"Pascale","text":"Fausse psy !"},{"actor":"Florence","label":"Florence","text":"Oui, fausse psy ! Enfin… Je crois que je suis psy. Alors que je suis complètement folle."},{"actor":"Christian","label":"Christian","text":"Voilà !"},{"actor":"Florence","label":"Florence","text":"Je peux pas jouer la psy bourrée plutôt ?"},{"actor":"Christian","label":"Christian","text":"Ben pourquoi tu veux jouer la psy bourrée d’un coup ???"},{"actor":"Florence","label":"Florence","text":"C’est plus facile à jouer…"},{"actor":"Christian","label":"Christian","text":"Ecoute, Flo ça fait huit mois que tu fais la folle, tu ne vas pas changer au dernier moment"},{"actor":"Florence","label":"Florence","text":"J’ai répété toute la semaine !"},{"actor":"Christian","label":"Christian","text":"Mais enfin tu vois bien que ça ne colle pas avec le personnage… Non, non on fait comme j’ai dit tu es folle !"},{"actor":"Florence","label":"Florence","text":"C’est à chaque fois pareil quand j’ai une bonne idée, tu ne la prends pas !"},{"actor":"Christian","label":"Christian","text":"Pascale, toi, tu es la vraie psy. Normalement la seule personne à peu près équilibrée de cet hôpital."},{"actor":"Pascale","label":"Pascale","text":"Normalement ?"},{"actor":"Christian","label":"Christian","text":"J’ai dit « à peu près » !"},{"actor":"Christian","label":"Christian","text":"Philippe, le patient… Le patient chiant !"},{"actor":"Philippe","label":"Philippe","text":"Oui, rôle de composition !"},{"actor":"Christian","label":"Christian","text":"Des fois le hasard…."},{"actor":"Christian","label":"Christian","text":"Patrice… Docteur Cash. Médecin de l’hôpital, sûr de lui, séducteur…"},{"actor":"Carole","label":"Carole","text":"Très séducteur !"},{"actor":"Christian","label":"Christian","text":"Oui… enfin, séducteur dans la pièce !"},{"actor":"Carole","label":"Carole","text":"Oui, oui… dans la pièce."},{"actor":"Christian","label":"Christian","text":"Et Nathalie joue Rose, l’infirmière. Énergique, dévouée, toujours en train de courir derrière le docteur Cash…"},{"actor":"Carole","label":"Carole","text":"Ça lui va bien."},{"actor":"Christian","label":"Christian","text":"Quoi ?"},{"actor":"Carole","label":"Carole","text":"Le rôle ! Je dis que le rôle lui va bien."},{"actor":"Patrice","label":"Patrice","text":"On peut peut-être répéter maintenant ?"},{"actor":"Christian","label":"Christian","text":"C’est exactement ce que j’essaie de faire depuis une demi-heure !"},{"actor":"Philippe","label":"Philippe","text":"Ça fait huit mois que tu essaies, il faudrait peut-être y arriver maintenant !"},{"actor":"Philippe","label":"Philippe (en riant)","text":"Je plaisante, bien sûr ! Je plaisante !"},{"actor":"Christian","label":"Christian","text":"Donc, on reprend avec le sketch « Pause Psy ». Caro fait son pitch d’intro au sketch, comme d’hab, et quand elle a fini, Flo, tu rentres et vous commencez… OK ?"},{"actor":"Carole","label":"Carole / Flo","text":"OK !"},{"actor":"Christian","label":"Christian","text":"Tout le monde en coulisses ! Caro, tu es prête ?"},{"actor":"Carole","label":"Carole","text":"On ne peut plus !"},{"actor":"Christian","label":"Christian","text":"C’est parti !"},{"actor":"Carole","label":"Secrétaire","text":"Maison Interdisciplinaire de Médecine et d’Observation Spécialisée des Affections Sévères, j’écoute."},{"actor":"Carole","label":"Secrétaire","text":"Maison Interdisciplinaire de Médecine et d’Observation Spécialisée des Affections Sévères, j’écoute."},{"actor":"Carole","label":"Secrétaire","text":"J’en peux plus, je vais prendre une pause !"},{"actor":"Christian","label":"Christian (agacé)","text":"Ben alors, qu’est-ce qu’elle fout, Flo ?! (Il crie.) FLORENCE, C’EST À TOI ! ELLE A DIT QU’ELLE ALLAIT PRENDRE SA PAUSE !!!"},{"actor":"Florence","label":"Florence","text":"Ah cool, on prend la pause ! J’ai la bouteille !"},{"actor":"Christian","label":"Christian (agacé)","text":"Mais non, on ne prend pas la pause !!! C’est le top pour le début du sketch ! Tu rentres quand tu entends « pause » ! C’est pas compliqué quand même !"},{"actor":"Florence","label":"Florence","text":"Euh… C’est pas compliqué, c’est pas compliqué… Il faut suivre !"},{"actor":"Carole","label":"Carole","text":"Tu l’as dit, il faut suivre !"},{"actor":"Christian","label":"Christian","text":"Bon, assieds-toi, c’est le début de « Pause Psy »."},{"actor":"Carole","label":"Cindy (feuillette son magazine)","text":"Tiens, tu vois, c’est comme toi : tu as bien une chatte ? Eh bien, selon une étude, 97 % des personnes ayant un animal domestique avouent parler à leur compagnon à quatre pattes."},{"actor":"Florence","label":"Pamela","text":"C’est débile ! Avec Michel, on ne se met pas à quatre pattes pour se parler sous prétexte qu’on a une chatte !"},{"actor":"Carole","label":"Cindy","text":"Mais non ! Tu avoues parler à ton compagnon à quatre pattes ! Ton chat, ton chien… tu lui parles !"},{"actor":"Florence","label":"Pamela","text":"Oh, je suis bête !! En plus, quand on est à quatre pattes, Michel est souvent derrière… alors du coup, je n’entends pas !"},{"actor":"Carole","label":"Cindy","text":"Oh là là, je ne veux pas le savoir !! Tu me fais imaginer quelque chose qui n’a rien à voir avec les petits animaux !"},{"actor":"Florence","label":"Pamela","text":"Il me fait ronronner !!"},{"actor":"Carole","label":"Cindy","text":"Mais arrête !"},{"actor":"Florence","label":"Pamela","text":"Et puis tu vois, c’est comme mon voisin : tout allait bien, il envisageait même d’acheter une voiture électrique… et un matin, comme ça, sa femme le quitte pour son patron ! Qui, en plus, le licencie le jour même ! Et tu sais quoi ? Ce jour-là, il pleuvait ! Du coup, il est devenu alcoolique…"},{"actor":"Christian","label":"Christian","text":"Ben Flo, qu’est-ce qu’il t’arrive ? Tu es bourrée ou quoi ?!"},{"actor":"Florence","label":"Florence","text":"Pas du tout !!! (Elle lève la bouteille et regarde au travers.) Je n’ai pas encore ouvert la bouteille !"},{"actor":"Christian","label":"Christian","text":"Ben alors, qu’est-ce qu’il t’arrive ?!"},{"actor":"Florence","label":"Florence","text":"Je te l’ai dit, je joue la psy alcoolo ! Je le fais bien, hein ?!"},{"actor":"Christian","label":"Christian","text":"Mais Pamela n’est pas alcoolique !"},{"actor":"Florence","label":"Florence","text":"Ah bon ?!"},{"actor":"Christian","label":"Christian","text":"Pourquoi tu voudrais qu’elle soit alcoolique ?!"},{"actor":"Florence","label":"Florence","text":"Ben… elle est psy."},{"actor":"Christian","label":"Christian","text":"Et ?!"},{"actor":"Florence","label":"Florence","text":"Elle écoute les problèmes des gens toute la journée… faut bien qu’elle décompresse !"},{"actor":"Carole","label":"Carole","text":"C’est pas faux."},{"actor":"Christian","label":"Christian","text":"Mais Pamela n’est pas une vraie psy, c’est une patiente de l’hôpital… Elle est folle, elle ne peut pas être alcoolique en plus !"},{"actor":"Florence","label":"Florence","text":"Et pourquoi ?!"},{"actor":"Christian","label":"Christian","text":"Pourquoi, pourquoi… Parce que c’est comme ça, voilà ! Puis c’est moi le metteur en scène, point !"},{"actor":"Florence","label":"Florence","text":"C’est toujours pareil, quand j’ai une bonne idée, tu dis non !"},{"actor":"Christian","label":"Christian","text":"Je ne dis pas toujours NON !"},{"actor":"Florence","label":"Florence","text":"Tu n’as jamais dit OUI !"},{"actor":"Carole","label":"Carole","text":"Ben dites donc, heureusement que vous ne jouez pas au ni oui ni non !"},{"actor":"Florence","label":"Florence","text":"Quand c’est Caro ou Nathalie qui proposent, tu dis oui !"},{"actor":"Christian","label":"Christian","text":"Je ne dis pas toujours OUI !"},{"actor":"Carole","label":"Carole","text":"Il faudrait savoir !"},{"actor":"Florence","label":"Florence","text":"Mais moi, j’ai répété toute la semaine ! Je tiens le rôle !"},{"actor":"Christian","label":"Christian","text":"ELLE NE PEUT PAS ÊTRE ALCOOLO, LA PSY, PUISQUE JE TE DIS QUE CE N’EST PAS UNE VRAIE PSY ! C’EST UNE TARÉE, ELLE NE PEUT PAS ÊTRE BOURRÉE EN PLUS…"},{"actor":"Florence","label":"Florence","text":"Et pourquoi pas ?!"},{"actor":"Christian","label":"Christian","text":"TU ME GONFLES !!!"},{"actor":"Carole","label":"Carole / Flo","text":"Oh !"},{"actor":"Christian","label":"Christian","text":"Ben OUI !"},{"actor":"Carole","label":"Carole","text":"Le jeu est terminé !"},{"actor":"Christian","label":"Christian","text":"Quelle heure est-il ?"},{"actor":"Carole","label":"Carole","text":"Il doit être vingt heures !"},{"actor":"Carole","label":"Carole","text":"Je vais essayer de rattraper le coup !"},{"actor":"Christian","label":"Christian","text":"Mais quelle galère ! Quelle galère ! On ne va jamais y arriver ! Et Nathalie qui n’arrive jamais… Qu’est-ce qu’elle fout, bordel ?!"},{"actor":"Christian","label":"Christian","text":"Bon… On va essayer de continuer !"},{"actor":"Christian","label":"Christian","text":"PASCALE, PHILIPPE, SUR SCÈNE, C’EST À VOUS !"},{"actor":"Pascale","label":"Pascale","text":"J’ai un de ces mal de tronche, moi !"},{"actor":"Christian","label":"Christian","text":"C’est bon, vous avez pu vous faire une petite italienne ?"},{"actor":"Philippe","label":"Philippe","text":"J’aurais aimé me faire une petite Italienne !"},{"actor":"Christian","label":"Christian","text":"?"},{"actor":"Philippe","label":"Philippe (en riant)","text":"Je plaisante, bien sûr ! Je plaisante !"},{"actor":"Christian","label":"Christian","text":"On va faire « Le tabac, c’est la santé ! ». Vous êtes prêts ?"},{"actor":"Philippe","label":"Philippe","text":"Comme une mariée un soir de noces !"},{"actor":"Christian","label":"Christian","text":"?"},{"actor":"Pascale","label":"Pascale","text":"J’ai une question : comment je me place par rapport à Philippe ?"},{"actor":"Christian","label":"Christian","text":"Je te l’ai déjà dit ! Tu te places légèrement en retrait, mais pas vraiment derrière. Il faut que tu sois à côté de lui tout en donnant l’impression que tu pourrais être ailleurs."},{"actor":"Pascale","label":"Pascale","text":"…C’est-à-dire ?"},{"actor":"Christian","label":"Christian","text":"C’est-à-dire que physiquement, tu es là… mais théâtralement, tu occupes un espace qui n’est pas tout à fait le même."},{"actor":"Pascale","label":"Pascale","text":"Ah…"},{"actor":"Christian","label":"Christian","text":"Ton corps est orienté vers Philippe, mais ton personnage, lui, reste ouvert au public."},{"actor":"Pascale","label":"Pascale","text":"Donc je me mets de profil ?"},{"actor":"Christian","label":"Christian","text":"Non ! Surtout pas ! Si tu te mets de profil, tu fermes l’espace."},{"actor":"Pascale","label":"Pascale","text":"Quel espace ?"},{"actor":"Christian","label":"Christian","text":"L’espace théâtral !"},{"actor":"Philippe","label":"Philippe","text":"Ah oui…"},{"actor":"Pascale","label":"Pascale","text":"Toi, t’as compris ?"},{"actor":"Philippe","label":"Philippe","text":"Absolument rien."},{"actor":"Christian","label":"Christian","text":"Mais enfin, c’est pas compliqué ! Il faut créer une proximité distante !"},{"actor":"Pascale","label":"Pascale","text":"Une quoi ?"},{"actor":"Christian","label":"Christian","text":"Une proximité distante ! Vous êtes proches sans être vraiment proches. Il faut sentir une distance dans la proximité… tout en gardant une proximité dans la distance."},{"actor":"Pascale","label":"Pascale","text":"T’as compris quelque chose ?"},{"actor":"Philippe","label":"Philippe","text":"Oui."},{"actor":"Christian","label":"Christian","text":"Ah ! Merci !"},{"actor":"Philippe","label":"Philippe","text":"Il faut qu’on soit loin… mais près."},{"actor":"Christian","label":"Christian","text":"Voilà !"},{"actor":"Pascale","label":"Pascale","text":"Ben on se met où, alors ?!"},{"actor":"Christian","label":"Christian","text":"LÀ !"},{"actor":"Pascale","label":"Pascale","text":"Mais… j’étais là !"},{"actor":"Christian","label":"Christian","text":"Oui, mais maintenant tu sais pourquoi !"},{"actor":"Pascale","label":"Pascale","text":"J’ai un de ces mal de tronche, moi !"},{"actor":"Christian","label":"Christian","text":"Et surtout Pascale parle fort !"},{"actor":"Pascale","label":"Docteur (Pascale)","text":"Vous fumez ?"},{"actor":"Philippe","label":"Patient (Philippe)","text":"Ah non !"},{"actor":"Pascale","label":"Docteur","text":"Vous n’avez jamais essayé ?"},{"actor":"Philippe","label":"Patient","text":"Il y a bien eu une fois… à l’anniversaire d’une pote, Katie… On était bourrés… on a essayé… Mais c’était vraiment pas bon."},{"actor":"Pascale","label":"Docteur (pas assez fort)","text":"Bon, on ne part pas de zéro ! Vous buvez de l’alcool, déjà, ça c’est un bon point. On y reviendra…"},{"actor":"Christian","label":"Christian","text":"Stop !"},{"actor":"Pascale","label":"Pascale","text":"Quoi ?"},{"actor":"Christian","label":"Christian","text":"Plus fort, Pascale !"},{"actor":"Pascale","label":"Pascale","text":"Je parle fort !"},{"actor":"Christian","label":"Christian","text":"Non, tu parles à Philippe ! Philippe, il est à cinquante centimètres, forcément qu’il t’entend ! Moi je veux que le dernier rang t’entende !"},{"actor":"Pascale","label":"Pascale","text":"Bon…"},{"actor":"Christian","label":"Christian","text":"Tu projettes ! Allez, reprenez."},{"actor":"Philippe","label":"Patient","text":"Mais je ne comprends pas, docteur…"},{"actor":"Pascale","label":"Docteur (un peu plus fort)","text":"Ce qu’il faut comprendre, c’est qu’en ne fumant pas, vous jouez avec votre mort ! Non mais je ne rigole pas ! Regardez-vous… vous n’avez pas l’impression de vous ennuyer ? De n’avoir aucune classe ?"},{"actor":"Christian","label":"Christian","text":"Pascale !"},{"actor":"Pascale","label":"Pascale","text":"QUOI ?!"},{"actor":"Christian","label":"Christian","text":"Voilà ! Ça, c’est le volume que je veux !"},{"actor":"Pascale","label":"Pascale","text":"Mais là je te parle à toi !"},{"actor":"Christian","label":"Christian","text":"Ben parle au public comme si tu me parlais à moi !"},{"actor":"Pascale","label":"Pascale","text":"Mais t’es à cinq mètres !"},{"actor":"Christian","label":"Christian","text":"Demain, il y en aura qui seront à quinze !"},{"actor":"Philippe","label":"Philippe","text":"On peut leur demander de se rapprocher."},{"actor":"Christian","label":"Christian","text":"Philippe…"},{"actor":"Philippe","label":"Philippe (en riant)","text":"Je plaisante, bien sûr ! Je plaisante !"},{"actor":"Christian","label":"Christian","text":"Continuez !"},{"actor":"Pascale","label":"Docteur","text":"Quand vous écoutez quelqu’un parler, comme ici, vous n’avez rien dans les mains. Vous ne vous sentez pas idiot ?"},{"actor":"Philippe","label":"Patient","text":"C’est-à-dire que je n’y avais pas vraiment pensé jusque-là…"},{"actor":"Pascale","label":"Docteur","text":"Je vais vous prescrire, pour commencer doucement, trois cigarettes par jour. Après les repas. Ou le matin avec le café : c’est la meilleure."},{"actor":"Philippe","label":"Patient","text":"J’apprécie ce que vous faites, docteur, mais j’aime vraiment pas le tabac !"},{"actor":"Pascale","label":"Docteur","text":"Mais rassurez-vous, il y en a pour tous les goûts ! Vous, vous êtes du genre à commencer par des menthol ! Bon, elles ne sont plus remboursées depuis avril… Mais si je vous mets les génériques…"},{"actor":"Philippe","label":"Patient","text":"Je ne suis vraiment pas sûr que ça m’aid…"},{"actor":"Pascale","label":"Docteur","text":"C’est simple, jeune homme."},{"actor":"Pascale","label":"Docteur","text":"En soirée, vous ne fumez pas : vous êtes isolé du groupe ! Votre stress augmente, vous n’avez rien pour le calmer… Une fois, deux fois… La troisième : dépression et suicide ! Vous voyez, vous déprimez déjà là…"},{"actor":"Philippe","label":"Patient","text":"Ah ben là, ouais…"},{"actor":"Pascale","label":"Docteur (enchaînant à toute vitesse)","text":"Deuxième cas de figure : vous fumez ! Vous êtes au centre du groupe, vous diminuez votre stress, vous augmentez votre charisme, vos liens sociaux, vous attirez la gent féminine ! Vous avez une copine ?"},{"actor":"Philippe","label":"Patient","text":"Non."},{"actor":"Pascale","label":"Docteur","text":"Eh ben voilà !"},{"actor":"Christian","label":"Christian","text":"STOP !!!"},{"actor":"Pascale","label":"Pascale","text":"Quoi encore ?!"},{"actor":"Christian","label":"Christian","text":"Mais articule !"},{"actor":"Pascale","label":"Pascale","text":"J’articule !"},{"actor":"Christian","label":"Christian","text":"T’articules rien du tout ! T’as bouffé des chamallows ou quoi ?!"},{"actor":"Pascale","label":"Pascale","text":"Mais je la connais, ma tirade !"},{"actor":"Christian","label":"Christian","text":"C’est justement ça le problème ! Tu la connais tellement que tu veux t’en débarrasser ! Tu fais « vousêtesaucentredugroupevousdiminuezvotrestressvousaugmentezvotrecharisme… » On dirait les mentions légales après un pub sur l’alcool à la radio !"},{"actor":"Philippe","label":"Philippe","text":"Moi j’ai compris."},{"actor":"Christian","label":"Christian","text":"Toi, tu connais le texte ! Reprends ! Et tu poses les mots. Tu respires. Tu AR-TI-CU-LES !"},{"actor":"Pascale","label":"Pascale (très lentement, en surarticulant)","text":"DEU-XIÈ-ME… CAS… DE… FI-GURE… VOUS… FU-MEZ…"},{"actor":"Christian","label":"Christian","text":"Non ! Pas comme ça non plus !"},{"actor":"Pascale","label":"Pascale","text":"Mais tu veux quoi ?!"},{"actor":"Christian","label":"Christian","text":"Du naturel ! Du naturel articulé !"},{"actor":"Philippe","label":"Philippe","text":"C'est comme le réalisme irréel ?"},{"actor":"Philippe","label":"Philippe (en riant)","text":"Je plaisante, bien sûr ! Je plaisante !"},{"actor":"Christian","label":"Christian","text":"Allez, finissez !"},{"actor":"Pascale","label":"Docteur","text":"Autre exemple…On se croise dans la rue. Il n’y a que vous et moi. Je veux m’allumer une cigarette… Je n’ai pas de feu. Qu’est-ce que je fais ?"},{"actor":"Philippe","label":"Patient","text":"Heu… vous me demandez du feu ?"},{"actor":"Pascale","label":"Docteur","text":"Exactement ! Et si vous ne fumez pas, que se passe-t-il ?"},{"actor":"Philippe","label":"Patient","text":"Ben… je vous dis poliment que je ne fume pas et que je n’ai pas de feu ?"},{"actor":"Pascale","label":"Docteur","text":"Vous vous rendez compte ?! C’était peut-être l’amour de votre vie ! Et là, qui a l’air d’un con ?"},{"actor":"Christian","label":"Christian","text":"Voilà… C’était mieux. Mais Pascale, demain, pense vraiment à porter ta voix jusqu’au fond et surtout à bien ar-ti-cu-ler parce que—"},{"actor":"Pascale","label":"Pascale","text":"OH MAIS TU ME FAIS CHIER !!!"},{"actor":"Christian","label":"Christian","text":"Voilà ! Comme ça, c’est bien ! Là, on comprend tout et on t’entend jusqu’au fond !"},{"actor":"Philippe","label":"Philippe","text":"Je crois qu’elle a compris le principe."},{"actor":"Christian","label":"Christian","text":"Tu crois ?"},{"actor":"Philippe","label":"Philippe","text":"Ah oui. Et je crois même qu’elle va le travailler dans les coulisses."},{"actor":"Christian","label":"Christian","text":"Bon… Toujours rien de Nathalie !"},{"actor":"Patrice","label":"Patrice","text":"Et moi, je fais quoi ?"},{"actor":"Christian","label":"Christian","text":"Comment ça, tu fais quoi ?"},{"actor":"Patrice","label":"Patrice","text":"Ben je répète quand ? Parce que toutes mes scènes sont avec l’infirmière Rose !"},{"actor":"Christian","label":"Christian","text":"Je sais !"},{"actor":"Patrice","label":"Patrice","text":"Ça fait trois fois d’affilée qu’elle arrive en retard… et sans énergie en plus !"},{"actor":"Carole","label":"Carole","text":"Ça doit être la Zumba."},{"actor":"Patrice","label":"Patrice","text":"Qu’est-ce que tu veux dire ?"},{"actor":"Carole","label":"Carole","text":"Rien ! Que ça doit être pénible d’attendre."},{"actor":"Christian","label":"Christian","text":"Bon… On ne va pas perdre encore une demi-heure. Je vais te donner la réplique."},{"actor":"Patrice","label":"Patrice","text":"Toi ?"},{"actor":"Christian","label":"Christian","text":"Oui, moi ! Mais attention, je te donne la réplique, je ne joue pas ! Moi, je suis metteur en scène, je ne suis pas comédien !"},{"actor":"Philippe","label":"Philippe","text":"Ça se voit."},{"actor":"Christian","label":"Christian","text":"Philippe…"},{"actor":"Philippe","label":"Philippe (en riant)","text":"Je plaisante, bien sûr ! Je plaisante !"},{"actor":"Christian","label":"Christian","text":"Bon, puisque tout le monde est là, vous regardez. Ça ne vous fera pas de mal !"},{"actor":"Florence","label":"Florence","text":"Ça dépend à qui."},{"actor":"Christian","label":"Christian","text":"Patrice, en place ! On va reprendre une de tes scènes avec Rose."},{"actor":"Patrice","label":"Patrice","text":"Laquelle ?"},{"actor":"Christian","label":"Christian","text":"Celle où vous êtes tous les deux."},{"actor":"Patrice","label":"Patrice","text":"Elles sont toutes comme ça."},{"actor":"Christian","label":"Christian","text":"Bon ben… celle-là !"},{"actor":"Christian","label":"Christian","text":"Je te préviens : je lis. Je ne joue pas Rose."},{"actor":"Florence","label":"Florence","text":"Dommage."},{"actor":"Christian","label":"Christian","text":"Pourquoi dommage ?"},{"actor":"Florence","label":"Florence","text":"Je t’aurais bien vu en infirmière."},{"actor":"Christian","label":"Christian","text":"Très drôle."},{"actor":"Carole","label":"Carole","text":"Moi aussi."},{"actor":"Christian","label":"Christian","text":"Bon ! On peut travailler ?!"},{"actor":"Patrice","label":"Patrice / Docteur Cash","text":"Un instant, je consulte le dossier. (Il se retourne vers l’infirmière pour lui parler, en masquant le micro du téléphone.) Mon petit, pourriez-vous aller me chercher le dossier de monsieur Martin ? Je l’ai laissé dans sa chambre, c’est en…"},{"actor":"Christian","label":"Christian / Rose (lisant platement)","text":"302, docteur. En 302 !"},{"actor":"Patrice","label":"Patrice / Docteur Cash","text":"Oui, c’est ça, c’est…"},{"actor":"Christian","label":"Christian","text":"STOP !"},{"actor":"Patrice","label":"Patrice","text":"Quoi ?"},{"actor":"Christian","label":"Christian","text":"Ton regard."},{"actor":"Patrice","label":"Patrice","text":"Quoi, mon regard ?"},{"actor":"Christian","label":"Christian","text":"Tu regardes Rose comme si elle venait te demander une ordonnance !"},{"actor":"Patrice","label":"Patrice","text":"Elle est infirmière."},{"actor":"Christian","label":"Christian","text":"Mais ce n’est pas la question ! Il faut qu’on sente qu’il y a quelque chose entre vous."},{"actor":"Carole","label":"Carole","text":"Ah ben ça…"},{"actor":"Christian","label":"Christian","text":"Quoi ?"},{"actor":"Carole","label":"Carole","text":"Rien, rien… Continue."},{"actor":"Christian","label":"Christian","text":"Entre le Docteur Cash et Rose, il y a une attirance. Quelque chose de contenu… de presque invisible."},{"actor":"Philippe","label":"Philippe","text":"Presque."},{"actor":"Christian","label":"Christian","text":"Voilà ! Presque !"},{"actor":"Carole","label":"Carole","text":"Très presque."},{"actor":"Christian","label":"Christian","text":"Patrice, concentre-toi ! Quand Rose te parle, tu ne l’écoutes pas seulement avec tes oreilles."},{"actor":"Philippe","label":"Philippe","text":"Ah bon ?"},{"actor":"Christian","label":"Christian","text":"Tu l’écoutes avec ton corps !"},{"actor":"Florence","label":"Florence","text":"Tout le corps ?"},{"actor":"Christian","label":"Christian","text":"Mais enfin ! Théâtralement !"},{"actor":"Carole","label":"Carole","text":"Ah ! Théâtralement…"},{"actor":"Christian","label":"Christian","text":"Patrice, regarde-moi."},{"actor":"Christian","label":"Christian","text":"Non."},{"actor":"Patrice","label":"Patrice","text":"Quoi, non ?"},{"actor":"Christian","label":"Christian","text":"Pas comme ça."},{"actor":"Patrice","label":"Patrice","text":"Comment ?"},{"actor":"Christian","label":"Christian","text":"Avec plus de désir."},{"actor":"Christian","label":"Christian","text":"Encore."},{"actor":"Christian","label":"Christian","text":"Encore…"},{"actor":"Christian","label":"Christian","text":"Voilà ! Là ! Là, il se passe quelque chose !"},{"actor":"Carole","label":"Carole","text":"Ah ben pour se passer quelque chose…"},{"actor":"Christian","label":"Christian","text":"Mais qu’est-ce que t’as, Carole ?!"},{"actor":"Carole","label":"Carole","text":"Rien ! Je trouve ça très… crédible."},{"actor":"Pascale","label":"Pascale","text":"Très naturel."},{"actor":"Florence","label":"Florence","text":"Limite documentaire."},{"actor":"Christian","label":"Christian","text":"Ben voilà ! Vous voyez quand vous voulez !"},{"actor":"Christian","label":"Christian","text":"Non ! Pourquoi tu recules ?!"},{"actor":"Patrice","label":"Patrice","text":"Ben…"},{"actor":"Christian","label":"Christian","text":"Avec Nathalie, tu recules comme ça ?"},{"actor":"Patrice","label":"Patrice","text":"…Non."},{"actor":"Christian","label":"Christian","text":"Ben alors ! Fais comme avec Nathalie !"},{"actor":"Patrice","label":"Patrice","text":"Comme avec Nathalie… quand ?"},{"actor":"Christian","label":"Christian","text":"QUAND VOUS JOUEZ, PATRICE !"},{"actor":"Patrice","label":"Patrice","text":"Ah ! Oui ! Quand on joue !"},{"actor":"Carole","label":"Carole","text":"C’est mieux de préciser."},{"actor":"Christian","label":"Christian","text":"Mais vous êtes chiants, ce soir !"},{"actor":"Philippe","label":"Philippe","text":"Moi, je trouve qu’il joue très juste."},{"actor":"Pascale","label":"Pascale","text":"Très, très juste."},{"actor":"Florence","label":"Florence","text":"On sent qu’il connaît son personnage."},{"actor":"Carole","label":"Carole","text":"Et sa partenaire."},{"actor":"Christian","label":"Christian","text":"Ben encore heureux ! Ça fait huit mois qu’ils répètent ensemble !"},{"actor":"Carole","label":"Carole","text":"C’est vrai… huit mois, ça crée des liens."},{"actor":"Patrice","label":"Patrice","text":"Bon, on peut reprendre ?!"},{"actor":"Christian","label":"Christian","text":"OUI ! Merci ! Et cette fois, Patrice, je veux de la complicité ! Tu oublies que c’est moi. Je suis Nathalie !"},{"actor":"Florence","label":"Florence","text":"Ah ben ça, il va falloir beaucoup d’imagination."},{"actor":"Philippe","label":"Philippe","text":"Surtout au niveau de la poitrine."},{"actor":"Christian","label":"Christian","text":"Philippe !!!"},{"actor":"Philippe","label":"Philippe (en riant)","text":"Je plaisante, bien sûr ! Je plaisante !"},{"actor":"Christian","label":"Christian","text":"Allez ! On reprend !"},{"actor":"Patrice","label":"Patrice / Docteur Cash","text":"Oui, c’est ça, c’est…"},{"actor":"Christian","label":"Christian / Rose (lui coupant la parole)","text":"Au bout du couloir, docteur, je sais !"},{"actor":"Christian","label":"Christian","text":"Bon, normalement là, Nathalie part en courant chercher le dossier."},{"actor":"Florence","label":"Florence","text":": Vas-y !"},{"actor":"Christian","label":"Christian","text":"Quoi, vas-y ?"},{"actor":"Florence","label":"Florence","text":"Ben va chercher le dossier."},{"actor":"Christian","label":"Christian","text":"Je vais pas courir, je vous ai dit que je donnais juste la réplique !"},{"actor":"Florence","label":"Florence","text":"Ah ben si tu fais pas les déplacements, Patrice peut pas travailler les siens."},{"actor":"Christian","label":"Christian","text":"Mais Patrice ne bouge pas !"},{"actor":"Carole","label":"Carole","text":"Justement, ça devrait pas être trop compliqué pour lui."},{"actor":"Christian","label":"Christian","text":"Bon…"},{"actor":"Philippe","label":"Philippe","text":"Plus vite, Rose !"},{"actor":"Christian","label":"Christian (depuis les coulisses)","text":"Philippe, tu me fais chier !"},{"actor":"Philippe","label":"Philippe","text":"Voilà ! Comme ça, c’est bien ! Là, on comprend tout et on t’entend jusqu’au fond !"},{"actor":"Christian","label":"Christian (depuis les coulisses)","text":"Très drôle !"},{"actor":"Christian","label":"Christian / Rose","text":"Vous l’aviez laissé à la machine à café, c’était moins loin !"},{"actor":"Patrice","label":"Patrice","text":"Et tu t’effondres."},{"actor":"Christian","label":"Christian","text":"Quoi ?"},{"actor":"Patrice","label":"Patrice","text":"Rose s’effondre."},{"actor":"Christian","label":"Christian","text":"Je sais ce que fait Rose, merci !"},{"actor":"Patrice","label":"Patrice","text":"Ben fais-le."},{"actor":"Christian","label":"Christian","text":"Je ne joue pas Rose !"},{"actor":"Carole","label":"Carole","text":"Ah bon ? Parce que là, ça commençait à venir."},{"actor":"Florence","label":"Florence","text":"Moi, j’y croyais."},{"actor":"Christian","label":"Christian","text":"ON CONTINUE !!!"},{"actor":"Christian","label":"Christian","text":"Ah ! Quand même !"},{"actor":"Christian","label":"Christian","text":"Allô ? … Oui… Ben justement, on t'attend ! … Comment ça ? … Non, Nathalie, on joue demain, là !"},{"actor":"Christian","label":"Christian","text":"Comment ça, tu ne viendras pas ? … Ce soir ?"},{"actor":"Christian","label":"Christian","text":"Demain non plus ?!"},{"actor":"Christian","label":"Christian","text":"Attends… J'ai pas compris, là… Tu arrêtes quoi ? La pièce ?"},{"actor":"Christian","label":"Christian","text":"Comment ça, « nous deux aussi » ?"},{"actor":"Christian","label":"Christian","text":"Nathalie… qu'est-ce que tu es en train de me dire ?"},{"actor":"Christian","label":"Christian","text":"Tu me quittes ?"},{"actor":"Christian","label":"Christian","text":"Mais… pourquoi ?"},{"actor":"Christian","label":"Christian","text":"Il y a quelqu'un d'autre ? Qui ?"},{"actor":"Christian","label":"Christian","text":"Depuis combien de temps ?"},{"actor":"Carole","label":"Carole","text":"Christian…"},{"actor":"Christian","label":"Christian","text":"Putain…"},{"actor":"Florence","label":"Florence","text":"Ça va ?"},{"actor":"Christian","label":"Christian","text":"À ton avis ?"},{"actor":"Philippe","label":"Philippe","text":"Si ça peut te rassurer…"},{"actor":"Philippe","label":"Philippe","text":"…Non. Rien."},{"actor":"Christian","label":"Christian","text":"Elle me trompe."},{"actor":"Pascale","label":"Pascale","text":"Elle t'a dit avec qui ?"},{"actor":"Christian","label":"Christian","text":"Non."},{"actor":"Christian","label":"Christian","text":"Mais c'est quelqu'un que je connais."},{"actor":"Patrice","label":"Patrice","text":"Quoi ?"},{"actor":"Patrice","label":"Patrice","text":"Pourquoi vous me regardez tous ?!"},{"actor":"Carole","label":"Carole","text":"Personne ne te regarde."},{"actor":"Patrice","label":"Patrice","text":"Vous êtes quatre à me regarder !"},{"actor":"Christian","label":"Christian","text":"Patrice…"},{"actor":"Patrice","label":"Patrice","text":"Ah non ! Me regarde pas comme ça, je vois très bien ce que t'es en train de penser !"},{"actor":"Christian","label":"Christian","text":"J'ai rien dit !"},{"actor":"Patrice","label":"Patrice","text":"T'as pas besoin ! Vous avez tous la gueule de mecs qui pensent que je couche avec sa femme !"},{"actor":"Philippe","label":"Philippe","text":"C'est assez précis comme gueule."},{"actor":"Patrice","label":"Patrice","text":"Philippe, ferme ta gueule !"},{"actor":"Christian","label":"Christian","text":"Attends, Patrice… Tu arrives systématiquement en retard aux répétitions, tout à l'heure tu me dis que t'as vu sa voiture et tu sais qu'elle arrive ici crevée…"},{"actor":"Patrice","label":"Patrice","text":"Mais vous le savez tous qu'elle arrive crevée ! Ça fait trois répétitions qu'elle débarque avec une heure de retard et qu'elle traîne les pieds !"},{"actor":"Carole","label":"Carole","text":"Oui… mais toi, t'as quand même l'air particulièrement bien renseigné."},{"actor":"Patrice","label":"Patrice","text":"Mais parce que vous êtes tous en train de me regarder comme si j'avais écrit « je baise Nathalie » sur le front !"},{"actor":"Philippe","label":"Philippe","text":"Tu ne la baises pas ?"},{"actor":"Patrice","label":"Patrice","text":"NON !!! Et puis merde, si vous avez un doute, demandez-lui directement !"},{"actor":"Christian","label":"Christian","text":"Elle répond plus… et je n’ai pas franchement envie de la rappeler pour lui demander si elle me quitte pour toi !"},{"actor":"Patrice","label":"Patrice","text":"Alors m'accuse pas ! Parce que là, depuis cinq minutes, tu me fais mon procès avec une voiture, trois retards et la fatigue de Nathalie !"},{"actor":"Christian","label":"Christian","text":"Je ne t’accuse pas, j'essaie de comprendre ! Mais reconnais quand même que tout ça mis bout à bout, ça fait beaucoup !"},{"actor":"Patrice","label":"Patrice","text":"MAIS C'EST PARCE QUE JE VAIS À LA ZUMBA AUSSI !!!"},{"actor":"Christian","label":"Christian","text":"Quoi ?"},{"actor":"Patrice","label":"Patrice","text":"Je vais à la Zumba ! Deux fois par semaine ! Voilà pourquoi j'arrive en retard aux répétitions : je sors du cours et je viens directement ici !"},{"actor":"Carole","label":"Carole","text":"Toi… tu fais de la Zumba ?"},{"actor":"Patrice","label":"Patrice","text":"Oui, Carole, moi ! Et la voiture de Nathalie, je l'ai vue devant la salle de Zumba ! Voilà ! Vous êtes contents ?!"},{"actor":"Christian","label":"Christian","text":"Attends…"},{"actor":"Patrice","label":"Patrice","text":"Quoi encore ?!"},{"actor":"Christian","label":"Christian","text":"Nathalie fait de la Zumba…"},{"actor":"Patrice","label":"Patrice","text":"Oui, je sais !"},{"actor":"Christian","label":"Christian","text":"Toi aussi…"},{"actor":"Patrice","label":"Patrice","text":"Oui !"},{"actor":"Christian","label":"Christian","text":"Donc vous êtes tous les deux au même endroit juste avant les répétitions."},{"actor":"Patrice","label":"Patrice","text":"Oh putain…"},{"actor":"Carole","label":"Carole","text":"Ah ben là, Patrice… pour te défendre, ce n’est pas terrible."},{"actor":"Patrice","label":"Patrice","text":"MAIS IL N'Y A RIEN À DÉFENDRE ! Oui, on est au même cours de Zumba, mais moi en troisième année et elle en première, on n’est pas ensemble ! Oui, je vois sa voiture ! Oui, j'arrive en retard parce que je viens directement ici ! Mais ça ne veut pas dire que je couche avec elle !"},{"actor":"Christian","label":"Christian","text":"Avoue quand même que, vu d'ici…"},{"actor":"Patrice","label":"Patrice","text":"MAIS ELLE M'INTÉRESSE PAS, NATHALIE !"},{"actor":"Christian","label":"Christian","text":"Qu'est-ce que j'en sais, moi ?!"},{"actor":"Patrice","label":"Patrice","text":"PARCE QU'AUCUNE FEMME NE M'INTERESSE !!!"},{"actor":"Christian","label":"Christian","text":"…Comment ça ?"},{"actor":"Patrice","label":"Patrice","text":"Oh putain…"},{"actor":"Patrice","label":"Patrice","text":"JE SUIS GAY, BORDEL !!!"},{"actor":"Christian","label":"Christian","text":"Quoi ?"},{"actor":"Patrice","label":"Patrice","text":"Gay !"},{"actor":"Christian","label":"Christian","text":"Toi ?!"},{"actor":"Patrice","label":"Patrice","text":"Oui, moi !"},{"actor":"Christian","label":"Christian","text":"Mais… gay ?!"},{"actor":"Patrice","label":"Patrice","text":"Homo ! Pédé ! Pédale ! Tu veux quoi de plus ? Une banderole ?!"},{"actor":"Florence","label":"Florence (sortant sa bouteille)","text":"Bon… ben moi, je crois qu'on a tous besoin d'un verre !"},{"actor":"Carole","label":"Carole","text":"Je pensais vraiment que tu te tapais Nathalie !"},{"actor":"Patrice","label":"Patrice","text":"Ni Nathalie, ni une autre !"},{"actor":"Carole","label":"Carole","text":"Aaaah…"},{"actor":"Patrice","label":"Patrice","text":"Quoi « aaaah » ?"},{"actor":"Carole","label":"Carole","text":"Ben je comprends mieux !"},{"actor":"Patrice","label":"Patrice","text":"Quoi encore ?!"},{"actor":"Carole","label":"Carole","text":"Pourquoi t'as jamais succombé à mon charme ! Putain, ça me rassure ! Je commençais à me poser des questions !"},{"actor":"Pascale","label":"Pascale","text":"Hé merde !!!"},{"actor":"Florence","label":"Florence","text":"Quoi ?"},{"actor":"Pascale","label":"Pascale","text":"J’avais un petit espoir !"},{"actor":"Patrice","label":"Patrice","text":"Désolé, Pascale !"},{"actor":"Pascale","label":"Pascale","text":"Ouais… ben je vais reprendre un Doliprane."},{"actor":"Christian","label":"Christian","text":"Putain… Patrice est gay…"},{"actor":"Patrice","label":"Patrice","text":"Tu vas t'en remettre ?"},{"actor":"Christian","label":"Christian","text":"Oui, oui… C'est juste que…"},{"actor":"Patrice","label":"Patrice","text":"Que quoi ?"},{"actor":"Christian","label":"Christian","text":"Rien ! Rien du tout !"},{"actor":"Christian","label":"Christian","text":"Mais depuis quand ?"},{"actor":"Patrice","label":"Patrice","text":"Depuis toujours, Christian ! Je ne l’ai pas attrapé hier !"},{"actor":"Christian","label":"Christian","text":"Mais pourquoi tu ne nous l’as jamais dit ?"},{"actor":"Patrice","label":"Patrice","text":"Parce que ça ne vous regarde pas ! Et surtout parce que jusqu'à ce soir, je n’avais jamais eu besoin de faire mon coming out pour prouver que je ne couchais pas avec la femme du metteur en scène !"},{"actor":"Christian","label":"Christian","text":"Bon…"},{"actor":"Christian","label":"Christian","text":"Donc… ce n’est pas Patrice."},{"actor":"Patrice","label":"Patrice","text":"AH ! Merci !"},{"actor":"Philippe","label":"Philippe","text":"Ah merde…"},{"actor":"Christian","label":"Christian","text":"Pourquoi « ah merde » ?"},{"actor":"Philippe","label":"Philippe","text":"Hein ?"},{"actor":"Carole","label":"Carole","text":"T'as dit « ah merde »."},{"actor":"Philippe","label":"Philippe","text":"Non."},{"actor":"Florence","label":"Florence","text":"Si. Tu as dit « ah merde » !"},{"actor":"Philippe","label":"Philippe","text":"Ah bon ?"},{"actor":"Patrice","label":"Patrice","text":"Oui, je l’ai bien entendu ! Tu as dit “ah merde” !"},{"actor":"Philippe","label":"Philippe","text":"Ben… merde pour Patrice."},{"actor":"Patrice","label":"Patrice","text":"Pourquoi « merde pour Patrice » ?! Parce que je suis gay ?"},{"actor":"Philippe","label":"Philippe","text":"Euh non… pour la Zumba."},{"actor":"Patrice","label":"Patrice","text":"Quoi, la Zumba ?"},{"actor":"Philippe","label":"Philippe","text":"Rien."},{"actor":"Philippe","label":"Philippe","text":"Je plaisante, bien sûr ! Je plaisante !"},{"actor":"Carole","label":"Carole","text":"Là, je ne vois pas bien où était la blague."},{"actor":"Philippe","label":"Philippe","text":"Moi non plus."},{"actor":"Christian","label":"Christian","text":"Bon, la Zumba, on s’en fout ! Ce que je veux savoir, c’est avec qui elle me trompe !"},{"actor":"Carole","label":"Carole","text":"Elle ne t’a vraiment rien dit ?"},{"actor":"Christian","label":"Christian","text":"Non !"},{"actor":"Pascale","label":"Pascale","text":"Même pas un indice ?"},{"actor":"Christian","label":"Christian","text":"Mais quel indice ?! Elle m’a dit qu’elle avait rencontré quelqu’un, qu’elle était bien avec lui, qu’il était attentionné…"},{"actor":"Florence","label":"Florence","text":"Ce n’est pas Patrice."},{"actor":"Patrice","label":"Patrice","text":"Merci !"},{"actor":"Christian","label":"Christian","text":"…qu’elle pouvait parler avec lui…"},{"actor":"Carole","label":"Carole","text":"Ce n’est toujours pas Patrice."},{"actor":"Patrice","label":"Patrice","text":"Ça va !"},{"actor":"Christian","label":"Christian","text":"…et qu’il la faisait rire."},{"actor":"Philippe","label":"Philippe","text":"Ah."},{"actor":"Christian","label":"Christian","text":"Quoi, « Ah » ?"},{"actor":"Philippe","label":"Philippe","text":"Rien."},{"actor":"Christian","label":"Christian","text":"Elle m’a dit exactement : « Avec lui, je rigole tout le temps. »"},{"actor":"Patrice","label":"Patrice","text":"Bon ben déjà, ce n’est pas moi."},{"actor":"Christian","label":"Christian","text":"Pourquoi ?!"},{"actor":"Patrice","label":"Patrice","text":"Parce que je ne suis pas drôle."},{"actor":"Carole","label":"Carole","text":"C’est vrai."},{"actor":"Patrice","label":"Patrice","text":"Merci Carole."},{"actor":"Florence","label":"Florence","text":"Quelqu’un qui la fait rire…"},{"actor":"Pascale","label":"Pascale","text":"Beaucoup…"},{"actor":"Carole","label":"Carole","text":"Tout le temps…"},{"actor":"Philippe","label":"Philippe","text":"Quoi ?"},{"actor":"Philippe","label":"Philippe","text":"Pourquoi vous me regardez ?"},{"actor":"Patrice","label":"Patrice","text":"Parce que tu fais des blagues tout le temps."},{"actor":"Philippe","label":"Philippe","text":"Ça ne veut rien dire !"},{"actor":"Carole","label":"Carole","text":"Non…"},{"actor":"Florence","label":"Florence","text":"Mais ça réduit les recherches."},{"actor":"Philippe","label":"Philippe","text":"Mais vous êtes cons ou quoi ?!"},{"actor":"Christian","label":"Christian","text":"Attendez…"},{"actor":"Christian","label":"Christian","text":"Nathalie rigole toujours à tes conneries."},{"actor":"Philippe","label":"Philippe","text":"Ben oui…"},{"actor":"Christian","label":"Christian","text":"Même quand elles ne sont pas drôles."},{"actor":"Philippe","label":"Philippe","text":"Ben… elle est bon public."},{"actor":"Pascale","label":"Pascale","text":"Très bon public, apparemment."},{"actor":"Philippe","label":"Philippe","text":"Oh ça va !"},{"actor":"Christian","label":"Christian","text":"Et l’autre soir, après la répétition… vous êtes partis presque en même temps."},{"actor":"Philippe","label":"Philippe","text":"Comme tout le monde !"},{"actor":"Carole","label":"Carole","text":"Pas vraiment."},{"actor":"Philippe","label":"Philippe","text":"Mais qu’est-ce que vous êtes en train de raconter ?!"},{"actor":"Christian","label":"Christian","text":"Philippe…"},{"actor":"Philippe","label":"Philippe","text":"Quoi ?"},{"actor":"Christian","label":"Christian","text":"C’est toi ?"},{"actor":"Philippe","label":"Philippe","text":"Quoi, c’est moi ?"},{"actor":"Christian","label":"Christian","text":"Ne me prends pas pour un con."},{"actor":"Philippe","label":"Philippe","text":"Mais je n’ai rien dit !"},{"actor":"Christian","label":"Christian","text":"EST-CE QUE TU COUCHES AVEC NATHALIE ?"},{"actor":"Philippe","label":"Philippe","text":"…"},{"actor":"Christian","label":"Christian","text":"Philippe ?"},{"actor":"Philippe","label":"Philippe","text":"…"},{"actor":"Patrice","label":"Patrice","text":"Ah ben là, il plaisante plus."},{"actor":"Christian","label":"Christian","text":"Putain… C’est toi."},{"actor":"Philippe","label":"Philippe","text":"Christian…"},{"actor":"Christian","label":"Christian","text":"C’EST TOI ?!"},{"actor":"Philippe","label":"Philippe","text":"Oui."},{"actor":"Carole","label":"Carole","text":"Oh putain…"},{"actor":"Florence","label":"Florence (sortant sa bouteille)","text":"Bon… là, par contre, je pense qu'on peut l'ouvrir."},{"actor":"Florence","label":"Florence","text":"Quoi ?! Si là c'est pas une urgence…"},{"actor":"Carole","label":"Carole","text":"Pour une fois, je suis assez d'accord."},{"actor":"Pascale","label":"Pascale","text":"Moi aussi."},{"actor":"Philippe","label":"Philippe","text":"Moi, je prendrais bien un verre."},{"actor":"Philippe","label":"Philippe","text":"Non ?"},{"actor":"Christian","label":"Christian","text":"NON !"},{"actor":"Florence","label":"Florence","text":"Bon ben… trois verres."},{"actor":"Pascale","label":"Pascale","text":"J’aurais jamais parié sur lui."},{"actor":"Philippe","label":"Philippe","text":"Merci Pascale."},{"actor":"Christian","label":"Christian","text":"Mais… toi ?!"},{"actor":"Philippe","label":"Philippe","text":"Ben oui."},{"actor":"Christian","label":"Christian","text":"TOI ?!"},{"actor":"Philippe","label":"Philippe","text":"Oui, j’ai compris."},{"actor":"Christian","label":"Christian","text":"Mais pourquoi toi ?!"},{"actor":"Philippe","label":"Philippe","text":"Ben… faudrait lui demander."},{"actor":"Christian","label":"Christian","text":"Elle vient de me quitter, je vais peut-être éviter de lui demander pourquoi elle préfère coucher avec toi !"},{"actor":"Christian","label":"Christian","text":"Putain… Philippe…"},{"actor":"Christian","label":"Christian","text":"Mais qu’est-ce qu’elle te trouve ?!"},{"actor":"Philippe","label":"Philippe","text":"Elle dit que je la fais rire."},{"actor":"Christian","label":"Christian","text":"Avec quoi ?!"},{"actor":"Philippe","label":"Philippe","text":"Ben… mes blagues."},{"actor":"Christian","label":"Christian","text":"Ses blagues ?!"},{"actor":"Carole","label":"Carole","text":"Chacun ses goûts."},{"actor":"Christian","label":"Christian","text":"Mais elles sont nulles, ses blagues !"},{"actor":"Philippe","label":"Philippe","text":"Nathalie les aime bien."},{"actor":"Christian","label":"Christian","text":"MAIS IL PASSE SON TEMPS À DIRE « JE PLAISANTE, BIEN SÛR ! JE PLAISANTE ! »"},{"actor":"Philippe","label":"Philippe","text":"Oui…"},{"actor":"Christian","label":"Christian","text":"C’EST MÊME PAS UNE BLAGUE, ÇA !"},{"actor":"Philippe","label":"Philippe","text":"Non, ça c’est après."},{"actor":"Christian","label":"Christian","text":"JE VAIS LE TUER."},{"actor":"Philippe","label":"Philippe","text":"Là, par contre, je préférerais que tu plaisantes."},{"actor":"Philippe","label":"Philippe (reculant)","text":"Je plaisante, bien sûr ! Je plaisante !"},{"actor":"Christian","label":"Christian","text":"BEN PAS MOI !!!"},{"actor":"Philippe","label":"Philippe","text":"Patrice !"},{"actor":"Patrice","label":"Patrice","text":"Ah non ! Démerde-toi ! Ça fait dix minutes que je prends pour toi !"},{"actor":"Philippe","label":"Philippe","text":"Mais protège-moi !"},{"actor":"Patrice","label":"Patrice","text":"Pourquoi ? T’as peur ?"},{"actor":"Philippe","label":"Philippe","text":"Non, je crée une proximité distante !"},{"actor":"Philippe","label":"Philippe","text":"Très distante ! La proximité !"},{"actor":"Carole","label":"Carole","text":"OH ! STOP ! Ça suffit maintenant !"},{"actor":"Carole","label":"Carole","text":"On réglera vos histoires de cul plus tard !"},{"actor":"Christian","label":"Christian","text":"Ce n’est pas une histoire de cul, c'est ma femme !"},{"actor":"Christian","label":"Christian","text":"Putain… Nathalie et Philippe…"},{"actor":"Christian","label":"Christian","text":"Depuis combien de temps ?"},{"actor":"Philippe","label":"Philippe","text":"Quelques mois."},{"actor":"Christian","label":"Christian","text":"Quelques mois… Et vous étiez là, tous les deux, à chaque répétition… devant moi…"},{"actor":"Carole","label":"Carole","text":"Christian… je sais que ce n'est vraiment pas le moment de te parler de ça…"},{"actor":"Christian","label":"Christian","text":"Alors pourquoi tu m'en parles ?"},{"actor":"Carole","label":"Carole","text":"Parce qu'on joue demain soir… et que Nathalie vient aussi de nous laisser sans infirmière Rose."},{"actor":"Patrice","label":"Patrice","text":"Et sans Rose, moi, je perds pratiquement la moitié de mon rôle. Toutes mes grosses scènes sont avec elle. Demain, je fais quoi ? Je reste en coulisses ?"},{"actor":"Philippe","label":"Philippe","text":"Ça te laissera le temps d'aller à la Zumba."},{"actor":"Philippe","label":"Philippe","text":"Oui… non. Pardon. Très mauvais moment."},{"actor":"Florence","label":"Florence","text":"Là, pour le coup, on est vraiment dans la merde."},{"actor":"Carole","label":"Carole","text":"Bon. On ne va pas rester là à se regarder jusqu'à demain soir. Il nous faut une solution."},{"actor":"Christian","label":"Christian","text":"Faites ce que vous voulez."},{"actor":"Carole","label":"Carole","text":"Comment ça, « faites ce que vous voulez » ?"},{"actor":"Christian","label":"Christian","text":"Exactement ce que ça veut dire. Ma femme vient de me quitter pour Philippe, et, là, tout de suite, je n’ai pas vraiment la tête à réfléchir aux entrées et sorties de l'infirmière Rose !"},{"actor":"Christian","label":"Christian","text":"Alors vous vouliez toujours donner votre avis sur tout ? Ben allez-y. Pour une fois, démerdez-vous sans moi."},{"actor":"Florence","label":"Florence","text":"Tout ?"},{"actor":"Christian","label":"Christian","text":"OUI !"},{"actor":"Christian","label":"Christian","text":"SAUF ÇA !"},{"actor":"Florence","label":"Florence","text":"Tu vois… même dépressif, il dit non."},{"actor":"Carole","label":"Carole","text":"Très bien."},{"actor":"Carole","label":"Carole","text":"Alors on va se démerder."},{"actor":"Carole","label":"Carole","text":"On reprend calmement. Notre problème, ce n’est pas de trouver la meilleure comédienne de France. Notre problème, c'est de trouver quelqu'un capable d'être sur scène demain soir sans foutre en l'air huit mois de répétitions."},{"actor":"Patrice","label":"Patrice","text":"Quelqu'un qui connaisse déjà un minimum la pièce. Qui soit capable d'apprendre le rôle de Rose en une nuit. Avec les déplacements"},{"actor":"Philippe","label":"Philippe","text":"Et idéalement quelqu'un qui rentre dans le costume."},{"actor":"Carole","label":"Carole","text":"Toi tu ferais mieux de faire profil bas, je te rappelle que si on en est là, tu y est pour quelque chose !"},{"actor":"Pascale","label":"Pascale","text":"Attendez… Il y aurait peut-être Laetitia."},{"actor":"Carole","label":"Carole","text":"Laetitia ?"},{"actor":"Pascale","label":"Pascale","text":"Ben oui ! Elle voulait la faire, la pièce, au départ. Elle n'avait pas pu, mais elle connaît quand même un peu l'histoire. On pourrait l'appeler."},{"actor":"Carole","label":"Carole","text":"Même si elle accepte, il faudrait qu'elle apprenne tout le texte cette nuit !"},{"actor":"Florence","label":"Florence","text":"Elle le connaîtra demain."},{"actor":"Carole","label":"Carole","text":"Laetitia ?"},{"actor":"Florence","label":"Florence","text":"Ah oui, non."},{"actor":"Carole","label":"Carole","text":"Laetitia, même au bout de six mois, elle ne connaît toujours pas son texte !"},{"actor":"Patrice","label":"Patrice","text":"Elle peut prendre le texte avec elle."},{"actor":"Carole","label":"Carole","text":"Pendant une heure et demie ?!"},{"actor":"Patrice","label":"Patrice","text":"On lui met dans un dossier médical. Ça fait infirmière."},{"actor":"Carole","label":"Carole","text":"Wouais bof !"},{"actor":"Patrice","label":"Patrice","text":"Je cherche une solution !"},{"actor":"Pascale","label":"Pascale","text":"Et puis elle joue bien, Laetitia ! Elle fait toujours des accents."},{"actor":"Florence","label":"Florence","text":"Oh putain, oui."},{"actor":"Carole","label":"Carole","text":"La dernière fois, elle a commencé belge…elle a fini québécoise."},{"actor":"Philippe","label":"Philippe","text":"C'est un long voyage."},{"actor":"Philippe","label":"Philippe","text":"Pardon."},{"actor":"Florence","label":"Florence","text":"Elle pourrait faire Rose avec un accent antillais !"},{"actor":"Carole","label":"Carole","text":"Mais pourquoi Rose serait antillaise ?!"},{"actor":"Florence","label":"Florence","text":"Pourquoi elle ne le serait pas ? Moi, j'aime bien."},{"actor":"Carole","label":"Carole","text":"« Docteu Cash, le patient de la chamb' trois cent deux vous attend ! »"},{"actor":"Florence","label":"Florence","text":"Ça donne du soleil à l'hôpital."},{"actor":"Christian","label":"Christian","text":"Rose ne pas être antillaise ! Ça ne colle pas avec le personnage !"},{"actor":"Carole","label":"Carole","text":"Je croyais que tu nous laissais nous démerder ?"},{"actor":"Christian","label":"Christian","text":"Je vous laisse vous démerder. Je vous informe. Pour faire gagner du temps !"},{"actor":"Carole","label":"Carole","text":"Bon. Pas Laetitia."},{"actor":"Florence","label":"Florence","text":"Attendez ! On garde Nathalie !"},{"actor":"Christian","label":"Christian","text":"QUOI ?!"},{"actor":"Florence","label":"Florence","text":"Pas Nathalie-Nathalie ! Sa voix !"},{"actor":"Christian","label":"Christian","text":"Ah…"},{"actor":"Carole","label":"Carole","text":"Quoi, sa voix ?"},{"actor":"Florence","label":"Florence","text":"On enregistre toutes ses répliques !"},{"actor":"Pascale","label":"Pascale","text":"J'ai un de ces mal de tronche…"},{"actor":"Florence","label":"Florence","text":"Patrice joue ses scènes normalement et on lance les répliques de Rose en voix off !"},{"actor":"Carole","label":"Carole","text":"Et Rose, elle est où ?!"},{"actor":"Florence","label":"Florence","text":"Dans sa chambre."},{"actor":"Carole","label":"Carole","text":"Quelle chambre ?!"},{"actor":"Florence","label":"Florence","text":"Je sais pas… elle est infirmière, elle travaille !"},{"actor":"Patrice","label":"Patrice","text":"J'ai quand même trois scènes où je lui parle en face !"},{"actor":"Florence","label":"Florence","text":"Tu regardes vers les coulisses."},{"actor":"Patrice","label":"Patrice","text":"Pendant trois scènes ?!"},{"actor":"Carole","label":"Carole","text":"Et quand Rose apporte le dossier ? Quand elle court ? Quand elle s'effondre ? On fait quoi ? On met un haut-parleur avec une blouse ?!"},{"actor":"Christian","label":"Christian","text":"CE N’EST PAS UN SPECTACLE DE MARIONNETTES !"},{"actor":"Carole","label":"Carole","text":"Ça va mieux ?"},{"actor":"Christian","label":"Christian","text":"Non."},{"actor":"Carole","label":"Carole","text":"Pourtant tu recommences à gueuler."},{"actor":"Christian","label":"Christian","text":"Parce que même si je au fond du seau, j'ai des oreilles !"},{"actor":"Christian","label":"Christian","text":"Enfin non ! Démerdez-vous !"},{"actor":"Carole","label":"Carole","text":"Bon. La voix enregistrée, on oublie."},{"actor":"Patrice","label":"Patrice","text":"Attendez. J'ai peut-être une solution beaucoup plus simple : on trouve une vraie infirmière."},{"actor":"Carole","label":"Carole","text":"Explique."},{"actor":"Patrice","label":"Patrice","text":"Une infirmière, elle sait déjà comment bouger, tenir un dossier, parler à un médecin… Elle aura au moins tout le côté médical du personnage. On lui apprend juste le texte."},{"actor":"Florence","label":"Florence","text":"Ce n’est pas bête."},{"actor":"Philippe","label":"Philippe","text":"Ça nous évite déjà d'avoir quelqu'un qui tient un stéthoscope comme une laisse pour chien."},{"actor":"Carole","label":"Carole","text":"Exactement. Il faudrait juste qu'elle soit disponible demain et qu'elle puisse apprendre vite."},{"actor":"Christian","label":"Christian depuis sa chaise","text":"Vingt pages."},{"actor":"Carole","label":"Carole","text":"Pardon ?"},{"actor":"Christian","label":"Christian","text":"Rose a vingt pages."},{"actor":"Patrice","label":"Patrice","text":"Oui, mais une infirmière, ça apprend vite."},{"actor":"Florence","label":"Florence","text":"Et elles font des études."},{"actor":"Christian","label":"Christian","text":"Mais qu'est-ce que ça vient foutre là, les études ?!"},{"actor":"Carole","label":"Carole","text":"Je sais pas. J'essaie de positiver."},{"actor":"Philippe","label":"Philippe","text":"On prend une infirmière comédienne."},{"actor":"Carole","label":"Carole","text":"Ah ben oui ! Bien sûr ! Une infirmière comédienne, libre demain soir, qui connaît la pièce et qui fait du 40 pour rentrer dans le costume de Nathalie ! Quelqu'un a ça dans ses contacts ?!"},{"actor":"Carole","label":"Carole","text":"Mais je plaisantais !!!"},{"actor":"Philippe","label":"Philippe","text":"Ah ! Tu vois que
