it le tour."},{"actor":"Patrice","label":"Patrice","text":"Sans Rose, je ne vois pas comment on peut jouer."},{"actor":"Florence","label":"Florence","text":"Putain… huit mois de répétitions pour s'arrêter la veille."},{"actor":"Carole","label":"Carole","text":"Christian ?"},{"actor":"Christian","label":"Christian","text":"Quoi ?"},{"actor":"Carole","label":"Carole","text":"C'est toi le metteur en scène. C'est à toi de décider."},{"actor":"Christian","label":"Christian","text":"Vous voulez que je décide quoi ? Nathalie se barre, on n'a plus Rose et personne ne peut apprendre le rôle pour demain."},{"actor":"Christian","label":"Christian","text":"Alors oui… on annule."},{"actor":"Carole","label":"Carole","text":"D'accord."},{"actor":"Carole","label":"Carole","text":"On annule."},{"actor":"Philippe","label":"Philippe","text":"Attends…"},{"actor":"Carole","label":"Carole","text":"Quoi ?"},{"actor":"Philippe","label":"Philippe","text":"Non… rien."},{"actor":"Carole","label":"Carole","text":"Philippe, si t'as une idée, c'est maintenant."},{"actor":"Philippe","label":"Philippe","text":"J'avais juste pensé à quelque chose… mais vu que tu m'as demandé de ne plus proposer de solution pendant vingt-quatre heures…"},{"actor":"Carole","label":"Carole","text":"Pour une fois, prends le risque."},{"actor":"Philippe","label":"Philippe","text":"Ben…"},{"actor":"Philippe","label":"Philippe","text":"On cherche depuis vingt minutes quelqu'un qui connaît la pièce, les scènes de Rose, ses entrées, ses sorties, ses déplacements…"},{"actor":"Pascale","label":"Pascale","text":"…et qui est disponible demain."},{"actor":"Patrice","label":"Patrice","text":"Attendez…"},{"actor":"Florence","label":"Florence","text":"Oh putain…"},{"actor":"Christian","label":"Christian","text":"Non."},{"actor":"Carole","label":"Carole","text":"Je n’ai encore rien dit."},{"actor":"Christian","label":"Christian","text":"Mais je sais ce que tu vas dire."},{"actor":"Carole","label":"Carole","text":"Alors ça prouve déjà que tu connais bien ton rôle."},{"actor":"Christian","label":"Christian","text":"NON."},{"actor":"Carole","label":"Carole","text":"Christian, réfléchis deux secondes. Tu connais toute la pièce. Tu connais toutes les entrées. Tous les déplacements. Tu as passé huit mois à nous expliquer exactement ce que Rose devait faire…"},{"actor":"Patrice","label":"Patrice","text":"Et tout à l'heure, tu as fait toute ma scène avec elle."},{"actor":"Christian","label":"Christian","text":"Je te donnais la réplique !"},{"actor":"Florence","label":"Florence","text":"Oui, ben… tu la donnais pas mal."},{"actor":"Christian","label":"Christian","text":"Je ne jouais pas !"},{"actor":"Carole","label":"Carole","text":"Justement. C'était très naturel."},{"actor":"Christian","label":"Christian","text":"JE SUIS METTEUR EN SCÈNE ! JE NE SUIS PAS COMÉDIEN !"},{"actor":"Carole","label":"Carole","text":"Ce soir, peut-être."},{"actor":"Carole","label":"Carole","text":"Demain… tu seras Rose."},{"actor":"Philippe","label":"Philippe","text":"Et finalement, on n'a même pas besoin de chercher quelqu'un qui rentre dans le costume."},{"actor":"Philippe","label":"Philippe","text":"Enfin… ça, on vérifiera demain."},{"actor":"Christian","label":"Christian","text":"Toi…"},{"actor":"Philippe","label":"Philippe","text":"Oui. Je sais. Je ferme ma gueule."},{"actor":"Carole","label":"Carole","text":"Bonsoir à toutes et à tous !"},{"actor":"Carole","label":"Carole","text":"…et là, derrière, j'ai actuellement cinq comédiens qui sont en train de se demander pourquoi ils ont accepté de faire du théâtre !"},{"actor":"Carole","label":"Carole","text":"Ils sont morts de trac !"},{"actor":"Carole","label":"Carole","text":"Et quand je dis « de dernière minute »… c'est vraiment de dernière minute !"},{"actor":"Carole","label":"Carole","text":"…le spectacle doit continuer !"},{"actor":"Carole","label":"Carole","text":"Et je crois qu'ils auraient bien besoin de vous entendre avant de commencer."},{"actor":"Carole","label":"Carole","text":"Ah non, non, non !"},{"actor":"Carole","label":"Carole","text":"Là, avec ça, ils annulent !"},{"actor":"Carole","label":"Carole","text":"Je vous ai dit qu'ils étaient morts de trouille ! Il faut qu'ils comprennent qu'ils ont un public avec eux !"},{"actor":"Carole","label":"Carole","text":"OUIIIII !!!"},{"actor":"Carole","label":"Carole","text":"VOUS ENTENDEZ ÇA ?!"},{"actor":"Carole","label":"Carole","text":"Merci pour eux !"},{"actor":"Carole","label":"Carole","text":"C'EST PARTI POUR LE SHOW !!!"},{"actor":"Carole","label":"Standardiste","text":"Maison Interdisciplinaire de Médecine et d'Observation Spécialisée des Affections Sévères, j'écoute."},{"actor":"Philippe","label":"Jean","text":"Ah pardon, j'ai dû faire une erreur de numéro, je voulais l'établissement « Les Mimosas » !"},{"actor":"Carole","label":"Standardiste","text":"C'est ce que je viens de vous dire, monsieur !"},{"actor":"Carole","label":"Standardiste","text":"Maison Interdisciplinaire de Médecine et d'Observation Spécialisée des Affections Sévères."},{"actor":"Philippe","label":"Jean","text":"C'est sûr que dit comme ça, ça fait moins rêver !"},{"actor":"Carole","label":"Standardiste","text":"Bon alors, que puis-je faire pour vous ?!"},{"actor":"Philippe","label":"Jean","text":"J'aimerais parler avec quelqu'un à propos d'un patient qui se trouve chez vous."},{"actor":"Carole","label":"Standardiste","text":"Quel est le nom du patient ?"},{"actor":"Philippe","label":"Jean","text":"Martin !"},{"actor":"Carole","label":"Standardiste","text":"Martin !!! J'en ai bien une dizaine des Martin ! C'est comme les Dupont ou Durand. C'est bien connu : il y a plus d'un âne qui s'appelle Martin !"},{"actor":"Carole","label":"Standardiste","text":"Normalement, là, ça rigole."},{"actor":"Philippe","label":"Jean","text":"Un prénom peut-être ?"},{"actor":"Carole","label":"Standardiste","text":"Ah oui ! Un prénom ?"},{"actor":"Philippe","label":"Jean","text":"Jean Martin. Chambre 302 !"},{"actor":"Carole","label":"Standardiste","text":"Ça y est, je l'ai ! Jean Martin, chambre 302 ! Un instant, je vous passe l'infirmière de service."},{"actor":"Christian","label":"Christian / Rose (essayant de se concentrer)","text":"Bonjour…"},{"actor":"Christian","label":"Christian / Rose","text":"Ici… mademoiselle Rose…"},{"actor":"Philippe","label":"Philippe / Jean (très discrètement)","text":"Infirmière de service…"},{"actor":"Christian","label":"Christian / Rose","text":"Je sais !"},{"actor":"Christian","label":"Christian / Rose (reprenant)","text":"…infirmière de service. Excusez-moi si je suis un peu essoufflée, j'arrive du troisième et l'ascenseur est en panne ! Que puis-je pour vous ?"},{"actor":"Philippe","label":"Philippe / Jean","text":"Je voudrais connaître l'état du patient Jean Martin, chambre 302."},{"actor":"Christian","label":"Christian / Rose","text":"Chambre 302…"},{"actor":"Philippe","label":"Philippe / Jean (discrètement)","text":"Troisième…"},{"actor":"Christian","label":"Christian / Rose","text":"Je sais !!!"},{"actor":"Philippe","label":"Philippe / Jean","text":"Je voulais juste t'aider."},{"actor":"Christian","label":"Christian / Rose (entre ses dents)","text":"N'aide pas."},{"actor":"Philippe","label":"Philippe / Jean","text":"D'accord."},{"actor":"Christian","label":"Christian / Rose","text":"…elle est au troisième étage, la chambre 302 ! Ici, vous êtes au deuxième étage ! C'est l'autre conn… heu… la standardiste qui s'est encore trompée !"},{"actor":"Carole","label":"Carole (depuis sa place)","text":"J'AI ENTENDU !"},{"actor":"Christian","label":"Christian / Rose","text":"Attendez, je vous passe le troisième !"},{"actor":"Philippe","label":"Philippe / Jean (regardant vers Carole)","text":"Ça se passe plutôt bien."},{"actor":"Christian","label":"Christian (depuis les coulisses)","text":"JE T'ENTENDS AUSSI !!!"},{"actor":"Philippe","label":"Philippe / Jean","text":"Je plaisante, bien sûr… je plaisante."},{"actor":"Christian","label":"Christian / Rose","text":"Bonjour, ici mademoiselle Rose, infirmière de service. Excusez-moi si je suis un peu essoufflée, j'arrive du deuxième et l'ascenseur est en panne ! Que puis-je pour vous ?"},{"actor":"Philippe","label":"Philippe / Jean (hésitant)","text":"Mademoiselle Rose ?!"},{"actor":"Philippe","label":"Philippe / Jean","text":"Heu… Je… Je voudrais connaître l'état du patient Jean Martin, chambre 302…"},{"actor":"Christian","label":"Christian / Rose","text":"Ah oui ! L'état de santé de monsieur Martin ! Un instant, je vais chercher le médecin de garde. Il est au quatrième !"},{"actor":"Philippe","label":"Philippe / Jean (au public)","text":"Je crois qu’elle ne m’aime pas beaucoup."},{"actor":"Christian","label":"Christian","text":"PHILIPPE !!!"},{"actor":"Philippe","label":"Philippe / Jean","text":"Je plaisante, bien sûr ! Je plaisante !"},{"actor":"Christian","label":"Christian / Rose","text":"Allô… vous êtes toujours là ?"},{"actor":"Philippe","label":"Philippe / Jean","text":"Toujours, oui…"},{"actor":"Christian","label":"Christian / Rose","text":"Je vous passe le docteur Cash !"},{"actor":"Patrice","label":"Patrice / Docteur Cash","text":"Docteur Cash à l'appareil. Je vous écoute."},{"actor":"Philippe","label":"Philippe / Jean","text":"Docteur, je voudrais savoir quel est l'état de monsieur Jean Martin, chambre 302. Il est chez vous depuis trois semaines."},{"actor":"Patrice","label":"Patrice / Docteur Cash","text":"Un instant, je consulte le dossier."},{"actor":"Patrice","label":"Patrice / Docteur Cash (avec beaucoup trop d'intensité)","text":"Mon petit… pourriez-vous aller me chercher le dossier de monsieur Martin ?"},{"actor":"Patrice","label":"Patrice / Docteur Cash","text":"Je l'ai laissé dans sa chambre, c'est en…"},{"actor":"Christian","label":"Christian / Rose","text":"302, docteur. En 302 !"},{"actor":"Patrice","label":"Patrice / Docteur Cash","text":"Oui… c'est ça…"},{"actor":"Christian","label":"Christian / Rose (très bas)","text":"N'en profite pas."},{"actor":"Patrice","label":"Patrice / Docteur Cash (très bas)","text":"Je joue."},{"actor":"Christian","label":"Christian / Rose","text":"Patrice…"},{"actor":"Patrice","label":"Patrice / Docteur Cash","text":"Docteur Cash."},{"actor":"Florence","label":"Florence","text":"Avec plus de désir…"},{"actor":"Pascale","label":"Pascale (depuis les coulisses)","text":"Tu l'écoutes avec ton corps !"},{"actor":"Christian","label":"Christian / Rose","text":"Je vous déteste."},{"actor":"Patrice","label":"Patrice / Docteur Cash","text":"C'est pas dans le texte."},{"actor":"Christian","label":"Christian / Rose (avec un immense sourire forcé)","text":"Au bout du couloir, docteur… je sais !"},{"actor":"Patrice","label":"Patrice / Docteur Cash","text":"Alors… alors… voyons, voyons…"},{"actor":"Philippe","label":"Philippe / Jean","text":"Docteur ?"},{"actor":"Patrice","label":"Patrice / Docteur Cash","text":"Hum…"},{"actor":"Philippe","label":"Philippe / Jean","text":"Docteur ?"},{"actor":"Patrice","label":"Patrice / Docteur Cash","text":"On attend l'infirmière."},{"actor":"Philippe","label":"Philippe / Jean","text":"Ah."},{"actor":"Patrice","label":"Patrice / Docteur Cash (vers les coulisses)","text":"Rose ?"},{"actor":"Philippe","label":"Philippe / Jean","text":"Elle est peut-être partie prendre l'ascenseur."},{"actor":"Philippe","label":"Philippe / Jean","text":"Je plaisante, bien sûr ! Je plaisante !"},{"actor":"Christian","label":"Christian / Rose","text":"Vous l'aviez laissé à la machine à café, c'était moins loin !"},{"actor":"Patrice","label":"Patrice (très discrètement)","text":"Tu t'effondres."},{"actor":"Patrice","label":"Patrice","text":"Rose s'effondre."},{"actor":"Florence","label":"Florence","text":"Plus naturel !"},{"actor":"Pascale","label":"Pascale","text":"Du naturel articulé !"},{"actor":"Christian","label":"Christian","text":"Vous voulez venir le faire ?!"},{"actor":"Christian","label":"Christian / Rose","text":"Pardon."},{"actor":"Patrice","label":"Patrice / Docteur Cash (consultant enfin le dossier)","text":"Alors… Il a bien mangé aujourd'hui, sa pression artérielle et son pouls sont stables, il réagit bien aux médicaments prescrits et normalement on va lui enlever le monitoring cardiaque demain."},{"actor":"Philippe","label":"Philippe / Jean","text":"Aaahhh ! Ce sont des nouvelles merveilleuses ! Je suis fou de joie ! Merci docteur, vous êtes formidable !"},{"actor":"Patrice","label":"Patrice / Docteur Cash (l'air suffisant)","text":"Oui, je sais, merci. L'établissement Les Mimosas est celui qui est doté des meilleurs docteurs ! Mais dites-moi, par votre façon de parler, je suppose que vous devez être quelqu'un de très proche, certainement un membre de la famille ?"},{"actor":"Philippe","label":"Philippe / Jean (énervé)","text":"Non, docteur, pas du tout ! Je suis Jean Martin en personne et je vous appelle de la chambre 302 !"},{"actor":"Carole","label":"Carole","text":"Finalement…"},{"actor":"Florence","label":"Florence","text":"…on l'a faite !"},{"actor":"Pascale","label":"Pascale","text":"Et personne n'a oublié son texte !"},{"actor":"Christian","label":"Christian","text":"Oh ça va !"},{"actor":"Patrice","label":"Patrice","text":"Et on était prêts."},{"actor":"Christian","label":"Christian","text":"À peu près."},{"actor":"Florence","label":"Florence","text":"Avec un certain réalisme…"},{"actor":"Carole","label":"Carole","text":"…irréel."},{"actor":"Florence","label":"Florence","text":"Bon…"},{"actor":"Florence","label":"Florence","text":"Maintenant, on peut prendre l'apéro ?"},{"actor":"Christian","label":"Christian","text":"OUI !"},{"actor":"Florence","label":"Florence","text":"ENFIN !!!"}];
const people={
 Christian:{voice:"jean",rate:1.00,desc:"Jean",sample:"https://huggingface.co/kyutai/tts-voices/resolve/main/ears/p010/freeform_speech_01_enhanced.wav"},
 Patrice:{voice:"marius",rate:0.98,desc:"Marius",sample:"https://huggingface.co/kyutai/tts-voices/resolve/main/voice-donations/Selfie.wav"},
 Philippe:{voice:"paul",rate:1.03,desc:"Paul",sample:"https://huggingface.co/kyutai/tts-voices/resolve/main/vctk/p259_023_enhanced.wav"},
 Carole:{voice:"cosette",rate:1.00,desc:"Cosette",sample:"https://huggingface.co/kyutai/tts-voices/resolve/main/expresso/ex04-ex02_confused_001_channel1_499s.wav"},
 Florence:{voice:"eponine",rate:1.03,desc:"Eponine",sample:"https://huggingface.co/kyutai/tts-voices/resolve/main/vctk/p262_023_enhanced.wav"},
 Pascale:{voice:"vera",rate:0.97,desc:"Vera",sample:"https://huggingface.co/kyutai/tts-voices/resolve/main/vctk/p229_023_enhanced.wav"}
};
const role=document.querySelector("#role"),status=document.querySelector("#status"),current=document.querySelector("#current"),pos=document.querySelector("#pos"),hint=document.querySelector("#hint"),speed=document.querySelector("#speed"),speedVal=document.querySelector("#speedVal");
let tts=null,i=0,running=false,audio=null,token=0;
const voiceRefs=new Map();
async function fetchVoicePcm(url){
 const res=await fetch(url);
 if(!res.ok)throw new Error("Échantillon vocal inaccessible ("+res.status+")");
 const buf=await res.arrayBuffer();
 const ctx=new (window.AudioContext||window.webkitAudioContext)();
 const decoded=await ctx.decodeAudioData(buf.slice(0));
 const mono=decoded.getChannelData(0).slice();
 const sr=decoded.sampleRate;
 await ctx.close();
 return {mono,sr};
}
async function getVoice(actor){
 if(voiceRefs.has(actor))return voiceRefs.get(actor);
 const cfg=people[actor];
 status.textContent="Préparation de la voix "+actor+" ("+cfg.desc+")…";
 const {mono,sr}=await fetchVoicePcm(cfg.sample);
 const ref=await tts.cloneVoice(mono,{inputSampleRate:sr,name:"acteur:"+actor});
 const out={ref,name:cfg.desc};
 voiceRefs.set(actor,out);
 return out;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function showLine(x,silent=false){pos.textContent="Réplique "+(i+1)+" / "+dialogue.length;current.innerHTML='<span class="who">'+x.label+'</span> : '+(silent?'<span class="muted">À toi…</span>':escapeHtml(x.text));hint.style.display="none";}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function gap(text){const words=text.split(/\s+/).length;return Math.max(1200,Math.min(9000,500+words*390/Number(speed.value)))}
async function say(x,myToken){
 const cfg=people[x.actor];
 const v=await getVoice(x.actor);
 status.textContent="Préparation de "+x.actor+" — "+v.name+"…";
 const chunks=[];
 await tts.generate(x.text,{voice:v.ref,onChunk:(chunk)=>chunks.push(new Float32Array(chunk))});
 if(myToken!==token)return;
 const wav=chunksToWavBlob(chunks,tts.sampleRate);
 audio=new Audio(URL.createObjectURL(wav));
 audio.playbackRate=cfg.rate*Number(speed.value);
 await audio.play();
 await new Promise(r=>{audio.onended=r;audio.onerror=r});
 status.textContent="Lecture…";
}
async function loop(){
 if(!tts){status.textContent="Le moteur vocal n'est pas encore prêt.";return}
 running=true;const my=++token;status.textContent="Lecture…";
 while(running&&i<dialogue.length&&my===token){
   const x=dialogue[i], mine=x.actor===role.value; showLine(x,mine);
   try{if(mine) await sleep(gap(x.text)); else await say(x,my)}catch(e){status.innerHTML='<span class="err">Erreur voix : '+escapeHtml(String(e))+'</span>';running=false;break}
   if(running&&my===token){i++;await sleep(250)}
 }
 if(i>=dialogue.length){running=false;status.innerHTML='<span class="ok">Fin du texte.</span>'}
}
function halt(){running=false;token++;if(tts)tts.stop().catch(()=>{});if(audio){audio.pause();audio=null}status.textContent="Arrêté."}
document.querySelector("#start").onclick=()=>{if(!running)loop()};
document.querySelector("#stop").onclick=halt;
document.querySelector("#prev").onclick=()=>{halt();i=Math.max(0,i-1);showLine(dialogue[i],dialogue[i].actor===role.value)};
document.querySelector("#hintBtn").onclick=()=>{const x=dialogue[i];if(x){hint.style.display="block";hint.innerHTML='<b>'+x.label+' :</b> '+escapeHtml(x.text)}};
document.querySelector("#go").onclick=()=>{halt();i=Math.max(0,Math.min(dialogue.length-1,Number(document.querySelector("#jump").value||1)-1));showLine(dialogue[i],dialogue[i].actor===role.value)};
speed.oninput=()=>speedVal.textContent=Number(speed.value).toFixed(2)+"×";
const vg=document.querySelector("#voicegrid");for(const n of Object.keys(people)){vg.insertAdjacentHTML("beforeend",'<span>'+n+' <small class="muted">('+people[n].desc+')</small></span><button data-n="'+n+'">▶ Tester</button>')}
vg.onclick=async e=>{
 const b=e.target.closest("button");if(!b||!tts)return;
 const n=b.dataset.n;b.disabled=true;status.textContent="Test de "+n+"…";
 try{
   const v=await getVoice(n),chunks=[];
   await tts.generate("Bonjour, je suis "+n+". On reprend le texte.",{voice:v.ref,onChunk:(chunk)=>chunks.push(new Float32Array(chunk))});
   const wav=chunksToWavBlob(chunks,tts.sampleRate);
   const a=new Audio(URL.createObjectURL(wav));a.playbackRate=people[n].rate;
   await a.play();
   status.innerHTML='<span class="ok">✓ '+n+' — voix '+escapeHtml(v.name)+'.</span>';
 }catch(err){status.innerHTML='<span class="err">✗ '+n+" : "+escapeHtml(String(err))+'</span>'}
 finally{b.disabled=false}
};
try{
 status.textContent="Chargement de Pocket TTS français…";
 tts=new PocketTTS({language:"french_24l",quantized:true,voiceCloning:true,cache:true,cacheName:"panique-pocket-fr-v2"});
 await tts.load(p=>{
   if(p.total){
     const pct=Math.round((p.loaded/p.total)*100);
     status.textContent="Pocket TTS : "+(p.label||"modèle")+" "+pct+" %";
   }else if(p.status){status.textContent="Pocket TTS : "+p.status}
 });
 status.innerHTML='<span class="ok">✓ Pocket TTS français prêt — voix des personnages prêtes à être initialisées.</span>';
 showLine(dialogue[0],dialogue[0].actor===role.value);
}catch(e){status.innerHTML='<span class="err">Erreur Pocket TTS : '+escapeHtml(String(e))+'</span>'}
</script></main></body></html>
